
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 13 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Exit", hint: "Prefix: EX- (Out)", definition: "To go out", sentence: "We needed to find the nearest emergency ______ to leave the building safely.", options: ["Macroscale", "Exit", "Misguided", "Exchange"] },
            { word: "Extinguisher", hint: "Prefix: EX- (Out)", definition: "A device used to put out fires", sentence: "He grabbed the fire ______ when the campfire sparked out of control.", options: ["Misnomer", "Macrocosm", "Extinguisher", "Examine"] },
            { word: "Exterminate", hint: "Prefix: EX- (Out)", definition: "To kill or destroy completely", sentence: "The landlord hired a professional to ______ the pests in the basement.", options: ["Exterminate", "Misdemeanor", "Macroscopic", "Misinterpret"] },
            { word: "Examine", hint: "Prefix: EX- (Out)", definition: "To look at closely; to inspect", sentence: "The detective used a magnifying glass to ______ the hidden clues.", options: ["Macroeconomics", "Exit", "Examine", "Misunderstood"] },
            { word: "Exchange", hint: "Prefix: EX- (Out)", definition: "To part with, give, or transfer in consideration of something received", sentence: "I'd like to ______ this sweater for a larger size, please.", options: ["Macrobiosis", "Exchange", "Extinguisher", "Misguided"] },
            { word: "Macroscale", hint: "Prefix: MACRO- (Large)", definition: "Largest scale used by meteorologists", sentence: "Weather patterns like hurricanes are viewed on a ______ by scientists.", options: ["Misinterpret", "Examine", "Macroscale", "Misnomer"] },
            { word: "Macrobiosis", hint: "Prefix: MACRO- (Large)", definition: "Longevity; long life", sentence: "Healthy eating and low stress are often linked to ______.", options: ["Exchange", "Misdemeanor", "Macrocosm", "Macrobiosis"] },
            { word: "Macrocosm", hint: "Prefix: MACRO- (Large)", definition: "The universe considered as a whole; the entire complex structure", sentence: "A single atom can be seen as a tiny version of the massive ______.", options: ["Macrocosm", "Extinguisher", "Macroscopic", "Misinterpret"] },
            { word: "Macroeconomics", hint: "Prefix: MACRO- (Large)", definition: "The study of the economy as a whole", sentence: "In college, he studied ______ to understand how national debt affects trade.", options: ["Misguided", "Macroeconomics", "Exit", "Macrobiosis"] },
            { word: "Macroscopic", hint: "Prefix: MACRO- (Large)", definition: "Large enough to be visible to the naked eye", sentence: "Unlike bacteria, these insects are ______ and easy to see without a microscope.", options: ["Examine", "Macroscopic", "Misunderstood", "Exchange"] },
            { word: "Misinterpret", hint: "Prefix: MIS- (Wrongly)", definition: "To understand incorrectly", sentence: "Be careful not to ______ my silence as agreement.", options: ["Misinterpret", "Macroscale", "Misdemeanor", "Exterminate"] },
            { word: "Misunderstood", hint: "Prefix: MIS- (Wrongly)", definition: "Wrongly or imperfectly understood", sentence: "The complex poem was often ______ by the younger students.", options: ["Macrocosm", "Misnomer", "Exit", "Misunderstood"] },
            { word: "Misguided", hint: "Prefix: MIS- (Wrongly)", definition: "Led by wrong or inappropriate motives; mistaken", sentence: "Her plan to fix the engine with duct tape was well-intentioned but ______.", options: ["Extinguisher", "Misguided", "Macroeconomics", "Examine"] },
            { word: "Misdemeanor", hint: "Prefix: MIS- (Wrongly)", definition: "A crime less serious than a felony; minor misconduct", sentence: "The teenager was charged with a ______ for the minor prank.", options: ["Misdemeanor", "Macrobiosis", "Exchange", "Macroscopic"] },
            { word: "Misnomer", hint: "Prefix: MIS- (Wrongly)", definition: "An unsuitable or misleading name", sentence: "Calling a 'killer whale' a whale is a ______; it's actually a dolphin.", options: ["Misinterpret", "Exterminate", "Misnomer", "Macroscale"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
