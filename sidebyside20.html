<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 20 Vocabulary Quiz</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Homeless", hint: "Suffix: -less (without)", definition: "Without a home.", sentence: "After the massive storm hit the coast, many families were unfortunately left ______ and needed a safe place to stay.", options: ["Homeless", "Childish", "Supremacy", "Fearless"] },
            { word: "Hopeless", hint: "Suffix: -less (without)", definition: "Providing no hope; beyond optimism or hope; desperate.", sentence: "When they were down by thirty points in the fourth quarter, winning the basketball game felt completely ______.", options: ["Legacy", "Hopeless", "Bureaucracy", "Selfish"] },
            { word: "Fearless", hint: "Suffix: -less (without)", definition: "Without fear.", sentence: "The ______ knight in the epic fantasy novel charged directly at the dragon without a second thought.", options: ["Lioness", "Democracy", "Fearless", "Amateurish"] },
            { word: "Legacy", hint: "Suffix: -acy (state or quality of)", definition: "An inheritance; something handed down from an ancestor or from the past.", sentence: "The author Brandon Sanderson is building a massive ______ with his incredibly detailed, interconnected fantasy series.", options: ["Conspiracy", "Legacy", "Fallacy", "Homeless"] },
            { word: "Democracy", hint: "Suffix: -acy (state or quality of)", definition: "A political system in which the supreme power lies in a body of citizens who can elect people to represent them.", sentence: "In a ______, the citizens of Greenville have the power to vote for their local leaders.", options: ["Democracy", "Hopeless", "Supremacy", "Childish"] },
            { word: "Supremacy", hint: "Suffix: -acy (state or quality of)", definition: "The state of being the highest or greatest.", sentence: "The ancient Roman Empire battled for hundreds of years to maintain its ______ over the entire Mediterranean region.", options: ["Amateurish", "Selfish", "Supremacy", "Lioness"] },
            { word: "Lioness", hint: "Suffix: -ess (female)", definition: "A female lion.", sentence: "At the zoo, we watched the ______ carefully guard her cubs while they slept.", options: ["Fearless", "Lioness", "Legacy", "Fallacy"] },
            { word: "Selfish", hint: "Suffix: -ish (somewhat like or near)", definition: "Caring only about yourself and not other people.", sentence: "It is very ______ to eat the entire pizza by yourself without offering a single slice to your friends.", options: ["Selfish", "Homeless", "Conspiracy", "Democracy"] },
            { word: "Amateurish", hint: "Suffix: -ish (somewhat like or near)", definition: "Lacking professional skill or expertise.", sentence: "The poorly edited video looked ______, like it was made by someone who had never used a camera before.", options: ["Supremacy", "Bureaucracy", "Hopeless", "Amateurish"] },
            { word: "Childish", hint: "Suffix: -ish (somewhat like or near)", definition: "Immature.", sentence: "Throwing a loud tantrum over losing a simple board game is a very ______ way to behave.", options: ["Childish", "Fearless", "Lioness", "Legacy"] },
            { word: "Conspiracy", hint: "Suffix: -acy (state or quality of)", definition: "A secret plan by a group to do something unlawful or harmful.", sentence: "The clever detectives uncovered a dangerous ______ to steal the kingdom's crown jewels.", options: ["Democracy", "Conspiracy", "Selfish", "Amateurish"] },
            { word: "Bureaucracy", hint: "Suffix: -acy (state or quality of)", definition: "A large, complex organization composed of appointed officials.", sentence: "Getting the new smart-home lights approved for the office building took months because of the complicated ______.", options: ["Fallacy", "Childish", "Bureaucracy", "Homeless"] },
            { word: "Fallacy", hint: "Suffix: -acy (state or quality of)", definition: "A mistaken belief, especially one based on unsound argument.", sentence: "The idea that lightning never strikes the same place twice is a well-known ______.", options: ["Hopeless", "Supremacy", "Fallacy", "Fearless"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        Hint: {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
