<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - Activity 4: Riddles</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --correct: #22c55e; --incorrect: #ef4444; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 20px; line-height: 1.6; max-width: 800px; margin: 0 auto; }
        .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .nav a { background: #e2e8f0; padding: 8px 15px; text-decoration: none; color: #1e293b; border-radius: 6px; font-weight: bold; }
        .nav a.active { background: var(--primary); color: white; }
        .nav a.back-link { background: #475569; color: white; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); margin-bottom: 20px; }
        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 15px; background: #eff6ff; border-radius: 8px; margin-bottom: 20px; }
        .word-chip { background: white; padding: 5px 12px; border-radius: 999px; font-size: 0.9em; font-weight: 600; color: var(--primary); }
        select { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-weight: 600; color: var(--primary); cursor: pointer; }
        select.correct { background: #dcfce7; border-color: var(--correct); color: #166534; }
        select.incorrect { background: #fee2e2; border-color: var(--incorrect); color: #991b1b; }
        .q-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
        .input-group { margin-bottom: 20px; text-align: center; }
        .input-group input { padding: 10px; width: 100%; max-width: 300px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1em; text-align: center; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.2s;}
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #results { text-align: center; font-size: 1.2em; font-weight: bold; margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="nav">
    <a href="https://andersm1-debug.github.io/7th-Grade-ELA/Week8.html" class="back-link">&larr; Back to Week 8</a>
    <a href="Week8-activity1.html">Act 1: Story</a>
    <a href="Week8-activity2.html">Act 2: Sentences</a>
    <a href="Week8-activity3.html">Act 3: Writing</a>
    <a href="Week8-activity4.html" class="active">Act 4: Riddles</a>
</div>

<div class="card">
    <h2 style="color:var(--primary); text-align:center;">Activity 4: "Who Am I?" Riddles</h2>
    
    <div class="input-group">
        <input type="text" id="studentName" placeholder="Enter your First & Last Name">
    </div>

    <div class="word-bank" id="bank"></div>
    <div id="questions"></div>
    <button id="submitBtn" onclick="grade()" style="margin-top:20px;">Grade & Turn In</button>
    <div id="results"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9hQTGB3p-5Jh0tHgY_oAcHNCmFD4ZCq4146hgHhUch__AHMQrVgD2PTZn6crK3BbR/exec"; 
    const ACTIVITY_NAME = "Week 8 Activity 4: Riddles";

    const words = ["philosopher", "deport", "philanthropist", "permit", "reporter", "remit", "import", "philology", "mission", "bibliophile", "remiss", "submit", "intermission", "portable", "commit"].sort();
    
    const questions = [
        "I am a person who absolutely loves to read, collect, and surround myself with books.",
        "I am the action of bringing goods and products from a foreign country into your own country to sell.",
        "I am the careless, forgetful, or neglectful way someone acts when they fail to do their duty.",
        "I am the short break in the middle of a theater performance or a long concert.",
        "I am the official piece of paper or card that gives you permission to do something, like drive or park.",
        "I am a wealthy person who donates huge amounts of money to charities and good causes.",
        "I am a deep thinker who studies the fundamental truths, knowledge, and meaning of life.",
        "I am a journalist whose job is to investigate events, interview people, and tell the news to the public.",
        "I am an important assignment, duty, or quest that you are sent out to complete.",
        "I am the action of sending money, usually to pay a bill or a debt.",
        "I am the study of language, literature, and the history of how words develop over time.",
        "I describe something that is lightweight and easy to carry around with you wherever you go.",
        "I am the action of forcing someone to leave a country, often because they broke the law.",
        "I am the action of promising, pledging, or dedicating yourself completely to a goal or a team.",
        "I am the action of handing in your work, like giving your finished test to the teacher."
    ];
    
    const answers = ["bibliophile", "import", "remiss", "intermission", "permit", "philanthropist", "philosopher", "reporter", "mission", "remit", "philology", "portable", "deport", "commit", "submit"];

    document.getElementById('bank').innerHTML = words.map(w => `<span class="word-chip">${w}</span>`).join('');
    const options = `<option value="">--</option>` + words.map(w => `<option value="${w}">${w}</option>`).join('');
    
    document.getElementById('questions').innerHTML = questions.map((q, i) => 
        `<div class="q-item"><p><strong>${i+1}.</strong> ${q}</p><strong>Who am I?</strong> <select id="q${i+1}" class="vocab-select">${options}</select></div>`
    ).join('');

    document.querySelectorAll('select').forEach(sel => sel.addEventListener('change', updateDropdowns));

    function updateDropdowns() {
        const selected = Array.from(document.querySelectorAll('select')).map(s => s.value).filter(v => v);
        document.querySelectorAll('select').forEach(sel => {
            const current = sel.value;
            Array.from(sel.options).forEach(opt => {
                opt.disabled = opt.value && selected.includes(opt.value) && opt.value !== current;
            });
        });
    }

    function grade() {
        const name = document.getElementById('studentName').value.trim();
        if (!name) {
            alert("Please enter your name before turning in!");
            return;
        }

        let score = 0;
        answers.forEach((ans, i) => {
            const el = document.getElementById(`q${i+1}`);
            el.classList.remove('correct', 'incorrect');
            if(el.value === ans) { el.classList.add('correct'); score++; }
            else { el.classList.add('incorrect'); }
        });
        
        const percentage = Math.round((score / 15) * 100);
        const res = document.getElementById('results');
        const btn = document.getElementById('submitBtn');
        
        res.style.display = 'block';
        res.style.background = '#eff6ff';
        res.style.color = '#1e3a8a';
        res.innerHTML = `You got ${score}/15 correct (${percentage}%).<br><em>Turning in to Google Drive...</em>`;
        btn.disabled = true;

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                name: name,
                activity: ACTIVITY_NAME,
                score: percentage + "%"
            })
        }).then(() => {
            res.style.background = '#dcfce7';
            res.style.color = '#166534';
            res.innerHTML = `Score: ${percentage}%<br><strong>✅ Turned In Successfully!</strong>`;
        }).catch(err => {
            res.style.background = '#fee2e2';
            res.style.color = '#991b1b';
            res.innerHTML = `<strong>❌ Error turning in. Please try again.</strong>`;
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
