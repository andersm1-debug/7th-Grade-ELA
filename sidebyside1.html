
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Audible", hint: "Root: AUDI (Hear)", definition: "Able to be heard", sentence: "The whisper was barely ______ over the loud music.", options: ["Biology", "Audible", "Dictionary", "Sensitive"] },
            { word: "Audience", hint: "Root: AUDI (Hear)", definition: "People assembled to listen at a movie, play, or meeting", sentence: "The ______ stood up and cheered at the end of the show.", options: ["Autograph", "Bionic", "Audience", "Resent"] },
            { word: "Audio Books", hint: "Root: AUDI (Hear)", definition: "A recording of a book", sentence: "I love listening to ______ during my long commute to school.", options: ["Sensation", "Demography", "Dictate", "Audio Books"] },
            { word: "Bionic", hint: "Root: BIO (Life)", definition: "Artificial body parts placed on a living human", sentence: "After the accident, he received a ______ arm that worked like a real one.", options: ["Bionic", "Contradict", "Audible", "Biography"] },
            { word: "Dictate", hint: "Root: DIC/DICT (Say)", definition: "An order that must be obeyed", sentence: "The general will ______ the terms of the peace treaty.", options: ["Audio Books", "Dictate", "Autobiography", "Sensitive"] },
            { word: "Sensitive", hint: "Root: SENS/SENT (Feel)", definition: "Quick to respond to slight changes or signals", sentence: "Be careful with that plant; it is very ______ to cold temperatures.", options: ["Biology", "Audience", "Sensitive", "Autograph"] },
            { word: "Autobiography", hint: "Roots: BIO (Life) / GRAPHY (Write)", definition: "An account of a person's life written by that person", sentence: "In his ______, the actor revealed the secrets of his childhood.", options: ["Dictionary", "Resent", "Bionic", "Autobiography"] },
            { word: "Biology", hint: "Root: BIO (Life)", definition: "The study of life", sentence: "In ______ class, we learned how cells divide and grow.", options: ["Biology", "Demography", "Sensation", "Dictate"] },
            { word: "Dictionary", hint: "Root: DIC/DICT (Say)", definition: "A resource that provides information regarding words", sentence: "I used the ______ to find the correct spelling of the word.", options: ["Contradict", "Audible", "Dictionary", "Biography"] },
            { word: "Resent", hint: "Root: SENS/SENT (Feel)", definition: "To feel bitterness or indignation", sentence: "It is easy to ______ someone who doesn't do their fair share of work.", options: ["Resent", "Audio Books", "Audience", "Autobiography"] },
            { word: "Demography", hint: "Root: GRAPHY (Write)", definition: "The science of recording people (populations)", sentence: "The government uses ______ to plan where to build new schools.", options: ["Sensitive", "Bionic", "Demography", "Autograph"] },
            { word: "Autograph", hint: "Root: GRAPHY (Write)", definition: "One's signature", sentence: "The fan was thrilled to get the quarterback's ______ on her jersey.", options: ["Dictate", "Biology", "Autograph", "Sensation"] },
            { word: "Biography", hint: "Roots: BIO (Life) / GRAPHY (Write)", definition: "A written account of someone’s life", sentence: "I am reading a ______ of Abraham Lincoln to learn about the Civil War.", options: ["Biography", "Dictionary", "Contradict", "Audible"] },
            { word: "Contradict", hint: "Root: DIC/DICT (Say)", definition: "To deny someone else’s statement of truth", sentence: "The evidence found at the scene seems to ______ his alibi.", options: ["Resent", "Contradict", "Demography", "Audio Books"] },
            { word: "Sensation", hint: "Root: SENS/SENT (Feel)", definition: "A physical feeling", sentence: "I had a strange tingling ______ in my foot after it fell asleep.", options: ["Autobiography", "Audience", "Sensation", "Biology"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
