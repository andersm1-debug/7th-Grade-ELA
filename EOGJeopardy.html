<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELA EOG Jeopardy Review</title>
    <style>
        :root {
            --blue: #060ce9;
            --yellow: #ffcc00;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: var(--white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: var(--yellow);
            text-transform: uppercase;
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px #000;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 95%;
            max-width: 1200px;
            padding: 20px;
        }

        .category-card {
            background-color: var(--blue);
            color: var(--white);
            text-align: center;
            padding: 15px 5px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .question-card {
            background-color: var(--blue);
            color: var(--yellow);
            border: 2px solid #fff;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .question-card:hover {
            transform: scale(1.05);
            background-color: #080fc2;
        }

        .question-card.visited {
            visibility: hidden;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--blue);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .modal-content {
            font-size: 3rem;
            margin-bottom: 30px;
            max-width: 80%;
        }

        .answer-text {
            display: none;
            color: var(--yellow);
            font-style: italic;
            margin-top: 20px;
        }

        .btn {
            background-color: var(--yellow);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #e6b800;
        }

        /* Score Tracker */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: #222;
            padding: 20px 0;
            position: sticky;
            bottom: 0;
            border-top: 3px solid var(--yellow);
        }

        .team {
            text-align: center;
        }

        .score {
            font-size: 2rem;
            display: block;
            color: var(--yellow);
        }

        .score-btns button {
            background: #444;
            color: white;
            border: 1px solid #777;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>ELA EOG Jeopardy</h1>
</header>

<div class="game-board" id="board">
    <!-- Categories -->
    <div class="category-card">Figurative Language</div>
    <div class="category-card">Plot & Story</div>
    <div class="category-card">Informational Text</div>
    <div class="category-card">Context Clues & Roots</div>
    <div class="category-card">Mixed Bag</div>

    <!-- Questions will be generated by JS -->
</div>

<!-- Question Modal -->
<div class="modal" id="modal">
    <div class="modal-content" id="modal-q">Question text goes here?</div>
    <div class="answer-text" id="modal-a">Answer goes here!</div>
    <div>
        <button class="btn" onclick="showAnswer()">Show Answer</button>
        <button class="btn" onclick="closeModal()">Back to Board</button>
    </div>
</div>

<div class="scoreboard">
    <div class="team">
        <span>Team 1</span>
        <span class="score" id="s1">0</span>
        <div class="score-btns">
            <button onclick="changeScore('s1', 100)">+</button>
            <button onclick="changeScore('s1', -100)">-</button>
        </div>
    </div>
    <div class="team">
        <span>Team 2</span>
        <span class="score" id="s2">0</span>
        <div class="score-btns">
            <button onclick="changeScore('s2', 100)">+</button>
            <button onclick="changeScore('s2', -100)">-</button>
        </div>
    </div>
    <div class="team">
        <span>Team 3</span>
        <span class="score" id="s3">0</span>
        <div class="score-btns">
            <button onclick="changeScore('s3', 100)">+</button>
            <button onclick="changeScore('s3', -100)">-</button>
        </div>
    </div>
</div>

<script>
    const gameData = [
        // Col 1: Figurative Language
        { q: "Giving human qualities to non-human things.", a: "What is Personification?", v: 100 },
        { q: "A comparison using 'like' or 'as'.", a: "What is a Simile?", v: 200 },
        { q: "An extreme exaggeration (e.g., 'I could eat a horse').", a: "What is Hyperbole?", v: 300 },
        { q: "A direct comparison NOT using 'like' or 'as'.", a: "What is a Metaphor?", v: 400 },
        { q: "Repetition of beginning consonant sounds.", a: "What is Alliteration?", v: 500 },
        
        // Col 2: Plot & Story
        { q: "The lesson or universal message of a story.", a: "What is Theme?", v: 100 },
        { q: "Perspective of the narrator (1st or 3rd).", a: "What is Point of View?", v: 200 },
        { q: "The turning point or most exciting part.", a: "What is Climax?", v: 300 },
        { q: "The introduction of characters and setting.", a: "What is Exposition?", v: 400 },
        { q: "A struggle between two opposing forces.", a: "What is Conflict?", v: 500 },

        // Col 3: Informational Text
        { q: "Text structure explaining similarities and differences.", a: "What is Compare and Contrast?", v: 100 },
        { q: "Description placed under a photo.", a: "What is a Caption?", v: 200 },
        { q: "Structure explaining an event and its results.", a: "What is Cause and Effect?", v: 300 },
        { q: "The author's main point or focus.", a: "What is Main Idea/Central Idea?", v: 400 },
        { q: "Information set apart from the main article, often in a box.", a: "What is a Sidebar?", v: 500 },

        // Col 4: Context Clues
        { q: "Word part added to the beginning of a base word.", a: "What is a Prefix?", v: 100 },
        { q: "Using surrounding words to find a meaning.", a: "What are Context Clues?", v: 200 },
        { q: "If 'bio' means life and 'logy' means study, this is 'Biology'.", a: "What is the study of life?", v: 300 },
        { q: "Word part added to the end of a word.", a: "What is a Suffix?", v: 400 },
        { q: "A word that means the opposite.", a: "What is an Antonym?", v: 500 },

        // Col 5: Mixed Bag
        { q: "Words that sound the same but differ in spelling/meaning.", a: "What are Homophones?", v: 100 },
        { q: "The emotional atmosphere created for the reader.", a: "What is Mood?", v: 200 },
        { q: "An educated guess based on evidence.", a: "What is an Inference?", v: 300 },
        { q: "PIED: Persuade, Inform, Entertain, Describe.", a: "What is Author's Purpose?", v: 400 },
        { q: "Language that appeals to the 5 senses.", a: "What is Sensory Imagery?", v: 500 }
    ];

    const board = document.getElementById('board');
    const modal = document.getElementById('modal');
    const modalQ = document.getElementById('modal-q');
    const modalA = document.getElementById('modal-a');

    // Create the board
    // We need to display by row, but data is by column. 
    // This loop ensures 100s appear first, then 200s, etc.
    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
            const index = col * 5 + row;
            const item = gameData[index];
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerText = item.v;
            card.onclick = () => openQuestion(item, card);
            board.appendChild(card);
        }
    }

    function openQuestion(item, card) {
        modalQ.innerText = item.q;
        modalA.innerText = item.a;
        modal.style.display = 'flex';
        card.classList.add('visited');
    }

    function showAnswer() {
        modalA.style.display = 'block';
    }

    function closeModal() {
        modal.style.display = 'none';
        modalA.style.display = 'none';
    }

    function changeScore(teamId, amount) {
        const scoreEl = document.getElementById(teamId);
        let currentScore = parseInt(scoreEl.innerText);
        scoreEl.innerText = currentScore + amount;
    }
</script>

</body>
</html>
