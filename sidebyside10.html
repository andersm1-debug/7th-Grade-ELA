
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 10 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Antiseptic", hint: "Prefix: ANTI- (Against)", definition: "Clean, sterile; substance that prevents infection", sentence: "Applying an ______ to the wound will help keep bacteria away.", options: ["Deflate", "Circumvent", "Antiseptic", "Decelerate"] },
            { word: "Antifreeze", hint: "Prefix: ANTI- (Against)", definition: "Substance added to liquid to lower its freezing point", sentence: "We checked the level of ______ in the truck before the blizzard hit.", options: ["Antifreeze", "Decrease", "Circumstance", "Antisocial"] },
            { word: "Antisocial", hint: "Prefix: ANTI- (Against)", definition: "Unsociable; unfriendly; avoiding company", sentence: "Choosing to eat lunch alone in the library isn't mean, it's just a bit ______.", options: ["Circumnavigate", "Antisocial", "Decaffeinated", "Antidote"] },
            { word: "Antidepressant", hint: "Prefix: ANTI- (Against)", definition: "Used or tending to relieve or prevent depression", sentence: "The doctor discussed the benefits of starting an ______ with the patient.", options: ["Deactivate", "Antidepressant", "Circumference", "Deflate"] },
            { word: "Antidote", hint: "Prefix: ANTI- (Against)", definition: "A remedy to counteract the effects of poison", sentence: "The scientists worked around the clock to synthesize an ______ for the toxin.", options: ["Circumspect", "Antiseptic", "Antidote", "Decrease"] },
            { word: "Deflate", hint: "Prefix: DE- (Away/From)", definition: "To reduce in size, importance, or effectiveness", sentence: "The pin-prick caused the giant balloon to slowly ______.", options: ["Deflate", "Antifreeze", "Circumvent", "Decelerate"] },
            { word: "Deactivate", hint: "Prefix: DE- (Away/From)", definition: "To make inactive or ineffective", sentence: "The technician had to ______ the laser before we could enter the room.", options: ["Circumstance", "Deactivate", "Antisocial", "Decaffeinated"] },
            { word: "Decaffeinated", hint: "Prefix: DE- (Away/From)", definition: "Having the caffeine removed", sentence: "If I drink anything other than ______ tea at night, I won't sleep.", options: ["Antidepressant", "Circumnavigate", "Decaffeinated", "Antidote"] },
            { word: "Decelerate", hint: "Prefix: DE- (Away/From)", definition: "To slow down or cause to slow down", sentence: "You must ______ the vehicle as you enter the construction zone.", options: ["Decelerate", "Circumference", "Antiseptic", "Deflate"] },
            { word: "Decrease", hint: "Prefix: DE- (Away/From)", definition: "To grow progressively less in size, amount, or intensity", sentence: "The heavy rain caused the temperature to ______ rapidly.", options: ["Deactivate", "Decrease", "Circumspect", "Antifreeze"] },
            { word: "Circumstance", hint: "Prefix: CIRCUM- (Around)", definition: "A condition or fact accompanying an event", sentence: "The strange ______ of the disappearance left the detectives baffled.", options: ["Antisocial", "Circumvent", "Circumstance", "Decaffeinated"] },
            { word: "Circumvent", hint: "Prefix: CIRCUM- (Around)", definition: "To get around; to bypass", sentence: "He tried to ______ the rules by finding a loophole in the contract.", options: ["Circumvent", "Antidepressant", "Decelerate", "Circumnavigate"] },
            { word: "Circumference", hint: "Prefix: CIRCUM- (Around)", definition: "The external boundary or perimeter of a circle", sentence: "We calculated the ______ of the circular track to be 400 meters.", options: ["Antidote", "Circumference", "Decrease", "Deflate"] },
            { word: "Circumnavigate", hint: "Prefix: CIRCUM- (Around)", definition: "To go completely around especially by water", sentence: "It took many months for the explorers to ______ the continent.", options: ["Deactivate", "Circumspect", "Antiseptic", "Circumnavigate"] },
            { word: "Circumspect", hint: "Prefix: CIRCUM- (Around)", definition: "Careful to consider all circumstances and consequences", sentence: "A ______ investor will always research a company before buying stock.", options: ["Circumspect", "Antifreeze", "Circumstance", "Decaffeinated"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
