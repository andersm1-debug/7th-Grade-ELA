<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 19 Vocabulary Quiz</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Capable", hint: "Suffix: -able (Able to be / Capable of)", definition: "Able to do something.", sentence: "The Lady Hornets proved they were ______ of winning the championship by practicing hard every single day.", options: ["Trendy", "Capable", "Relationship", "Feasible"] },
            { word: "Sensible", hint: "Suffix: -ible (Able to be / Capable of)", definition: "(Of a statement or course of action) chosen in accordance with wisdom or prudence; likely to be of benefit.", sentence: "Bringing an umbrella on a dark, cloudy day is a ______ decision if you don't want to get soaked.", options: ["Reliable", "Hardship", "Sensible", "Bitterness"] },
            { word: "Reliable", hint: "Suffix: -able (Able to be / Capable of)", definition: "Deserving trust, dependable.", sentence: "My old car is very ______; it starts up every morning without any issues.", options: ["Farsightedness", "Healthy", "Leadership", "Reliable"] },
            { word: "Healthy", hint: "Suffix: -y (Characterized by / Full of)", definition: "In good health.", sentence: "Eating your vegetables and exercising regularly will help you stay strong and ______.", options: ["Healthy", "Wealthy", "Debatable", "Loneliness"] },
            { word: "Wealthy", hint: "Suffix: -y (Characterized by / Full of)", definition: "Rich.", sentence: "The king in the epic fantasy novel was incredibly ______, with a massive vault full of gold and jewels.", options: ["Bitterness", "Capable", "Wealthy", "Trendy"] },
            { word: "Trendy", hint: "Suffix: -y (Characterized by / Full of)", definition: "Of or relating to the latest trend or style.", sentence: "Everyone at school started wearing that ______ new brand of sneakers.", options: ["Trendy", "Relationship", "Sensible", "Leadership"] },
            { word: "Relationship", hint: "Suffix: -ship (State or condition of)", definition: "The way in which two or more concepts, objects, or people are connected, or the state of being connected.", sentence: "A dog and its owner usually share a very close, loyal ______.", options: ["Relationship", "Feasible", "Reliable", "Hardship"] },
            { word: "Hardship", hint: "Suffix: -ship (State or condition of)", definition: "Something that causes suffering or difficulty; a condition that is hard to bear.", sentence: "Surviving the harsh winter without enough food was a terrible ______ for the early pioneers.", options: ["Healthy", "Hardship", "Happiness", "Wealthy"] },
            { word: "Leadership", hint: "Suffix: -ship (State or condition of)", definition: "The use of power and influence to direct the activities of followers toward goal achievement.", sentence: "The team captain showed great ______ by encouraging the younger players when they were losing.", options: ["Leadership", "Loneliness", "Trendy", "Debatable"] },
            { word: "Happiness", hint: "Suffix: -ness (State or quality of)", definition: "The state of being happy.", sentence: "Seeing my dogs, Sara and Jamie, waiting for me at the door always brings me pure ______.", options: ["Bitterness", "Farsightedness", "Capable", "Happiness"] },
            { word: "Loneliness", hint: "Suffix: -ness (State or quality of)", definition: "Sadness because one has no friends or company.", sentence: "After moving to a new city where he didn't know anyone, he felt a deep sense of ______.", options: ["Sensible", "Loneliness", "Reliable", "Healthy"] },
            { word: "Bitterness", hint: "Suffix: -ness (State or quality of)", definition: "A feeling of disgust or resentment.", sentence: "Even years after the argument, she still held onto her ______ and refused to speak to him.", options: ["Wealthy", "Bitterness", "Leadership", "Relationship"] },
            { word: "Debatable", hint: "Suffix: -able (Able to be / Capable of)", definition: "Open to discussion or argument.", sentence: "Whether pineapple belongs on pizza is highly ______ and often leads to funny arguments in the cafeteria.", options: ["Debatable", "Hardship", "Happiness", "Feasible"] },
            { word: "Farsightedness", hint: "Suffix: -ness (State or quality of)", definition: "Distant objects are seen clearly but close objects appear blurry.", sentence: "Because of his ______, he needed reading glasses to see the words in his book clearly.", options: ["Loneliness", "Trendy", "Farsightedness", "Capable"] },
            { word: "Feasible", hint: "Suffix: -ible (Able to be / Capable of)", definition: "Possible, able to be done.", sentence: "Finishing the entire science fair project in one single night is not a ______ plan.", options: ["Sensible", "Feasible", "Bitterness", "Reliable"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        Hint: {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
