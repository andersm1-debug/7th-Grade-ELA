<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELA EOG Jeopardy Review</title>
  <style>
    :root {
      --bg-1: #020617;
      --bg-2: #0f172a;
      --panel: rgba(15, 23, 42, 0.86);
      --panel-strong: #111c35;
      --tile: #1438d6;
      --tile-dark: #09219a;
      --tile-used: #1e293b;
      --gold: #facc15;
      --gold-2: #fde68a;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --white: #f8fafc;
      --muted: #cbd5e1;
      --border: rgba(255, 255, 255, 0.18);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.22), transparent 32rem),
        radial-gradient(circle at top right, rgba(250, 204, 21, 0.13), transparent 28rem),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 55%, #020617);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
    }

    .page-shell {
      width: min(1400px, 96vw);
      margin: 0 auto;
      padding: 24px 0 130px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      margin-bottom: 18px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title-block {
      min-width: 240px;
    }

    .eyebrow {
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 800;
      font-size: 0.78rem;
      margin: 0 0 4px;
    }

    h1 {
      color: var(--gold);
      text-transform: uppercase;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 0.95;
      margin: 0;
      text-shadow: 0 4px 0 #000, 0 0 26px rgba(250, 204, 21, 0.24);
    }

    .subtitle {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .pill-btn {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .02em;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .pill-btn:hover {
      transform: translateY(-2px);
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .pill-btn.warning:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.55);
    }

    .board-wrap {
      background: rgba(2, 6, 23, 0.48);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: clamp(10px, 2vw, 18px);
      box-shadow: var(--shadow);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: clamp(8px, 1.4vw, 14px);
    }

    .category-card,
    .question-card {
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 16px;
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .category-card {
      background:
        linear-gradient(180deg, rgba(56, 189, 248, 0.28), rgba(20, 56, 214, 0.16)),
        var(--panel-strong);
      color: var(--white);
      padding: 14px 10px;
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(0.76rem, 1.25vw, 1.05rem);
      line-height: 1.1;
      letter-spacing: 0.04em;
    }

    .question-card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.22), transparent 16%),
        linear-gradient(145deg, #1d4ed8, var(--tile-dark));
      color: var(--gold);
      aspect-ratio: 4 / 2.8;
      font-size: clamp(1.65rem, 4vw, 3rem);
      font-weight: 950;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      text-shadow: 0 3px 0 #000, 0 0 12px rgba(250,204,21,.28);
    }

    .question-card::after {
      content: "";
      position: absolute;
      inset: -60%;
      background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.23), transparent 58%);
      transform: translateX(-55%) rotate(8deg);
      transition: transform .45s ease;
    }

    .question-card:hover {
      transform: translateY(-4px) scale(1.02);
      filter: brightness(1.1);
      box-shadow: 0 22px 34px rgba(0, 0, 0, 0.36), 0 0 0 2px rgba(250,204,21,.22);
    }

    .question-card:hover::after {
      transform: translateX(55%) rotate(8deg);
    }

    .question-card.used {
      background: linear-gradient(145deg, #111827, var(--tile-used));
      color: rgba(203, 213, 225, 0.42);
      cursor: default;
      text-shadow: none;
      filter: grayscale(0.35);
    }

    .question-card.used::before {
      content: "USED";
      position: absolute;
      inset: auto 10px 10px;
      color: rgba(248,250,252,.46);
      font-size: .78rem;
      letter-spacing: .16em;
      text-shadow: none;
    }

    .question-card.used:hover {
      transform: none;
      box-shadow: 0 14px 24px rgba(0,0,0,.28);
      filter: grayscale(.35);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at top, rgba(56,189,248,.24), transparent 30rem),
        rgba(2, 6, 23, .92);
      backdrop-filter: blur(12px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(1000px, 94vw);
      min-height: min(680px, 90vh);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid var(--border);
      border-radius: 30px;
      background:
        linear-gradient(160deg, rgba(20,56,214,.92), rgba(15,23,42,.94)),
        var(--tile);
      box-shadow: var(--shadow), 0 0 70px rgba(56,189,248,.18);
      text-align: center;
    }

    .modal-topline {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .badge {
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(2, 6, 23, 0.34);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--gold-2);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .82rem;
    }

    .modal-content {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.12;
      font-weight: 900;
      text-shadow: 0 4px 0 rgba(0,0,0,.45);
      margin: auto 0;
    }

    .answer-text {
      display: none;
      color: var(--gold);
      background: rgba(2, 6, 23, 0.42);
      border: 1px solid rgba(250,204,21,.35);
      border-radius: 22px;
      padding: 22px;
      font-size: clamp(1.6rem, 4vw, 3rem);
      font-weight: 950;
      text-shadow: 0 2px 0 #000;
    }

    .answer-text.visible {
      display: block;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 1rem;
      font-weight: 950;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn.answer {
      background: var(--gold);
      color: #111827;
    }

    .btn.used {
      background: var(--green);
      color: #052e16;
    }

    .btn.close {
      background: rgba(255,255,255,.12);
      color: var(--white);
      border: 1px solid var(--border);
    }

    .scoreboard {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 50;
      width: min(1180px, 96vw);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(2, 6, 23, 0.84);
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
    }

    .team {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.9);
    }

    .team-name {
      font-weight: 950;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score {
      grid-row: span 2;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      font-weight: 950;
      color: var(--gold);
      text-shadow: 0 3px 0 #000;
      min-width: 90px;
      text-align: right;
    }

    .score-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .score-btns button {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--white);
      border-radius: 10px;
      padding: 7px 9px;
      font-weight: 900;
      cursor: pointer;
    }

    .score-btns button:hover {
      background: rgba(56,189,248,.18);
    }

    @media (max-width: 850px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .game-board {
        grid-template-columns: repeat(5, minmax(82px, 1fr));
      }

      .category-card {
        min-height: 74px;
        font-size: .66rem;
      }

      .question-card {
        min-height: 70px;
      }

      .scoreboard {
        position: static;
        transform: none;
        margin: 18px auto 0;
        grid-template-columns: 1fr;
      }

      .page-shell {
        padding-bottom: 24px;
      }

      .team {
        grid-template-columns: 1fr auto;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header>
      <div class="title-block">
        <p class="eyebrow">7th Grade ELA Review</p>
        <h1>ELA EOG Jeopardy</h1>
        <p class="subtitle">Choose a category, reveal the question, then award points after the answer.</p>
      </div>
      <div class="top-actions">
        <button class="pill-btn" onclick="closeModal()">Back to Board</button>
        <button class="pill-btn warning" onclick="resetGame()">Reset Game</button>
      </div>
    </header>

    <section class="board-wrap" aria-label="ELA EOG Jeopardy game board">
      <div class="game-board" id="board">
        <div class="category-card">Figurative Language</div>
        <div class="category-card">Plot & Story</div>
        <div class="category-card">Informational Text</div>
        <div class="category-card">Context Clues & Roots</div>
        <div class="category-card">Mixed Bag</div>
      </div>
    </section>

    <section class="scoreboard" aria-label="Team scoreboard">
      <div class="team">
        <span class="team-name">Team 1</span>
        <span class="score" id="s1">0</span>
        <div class="score-btns">
          <button onclick="changeScore('s1', 100)">+100</button>
          <button onclick="changeScore('s1', -100)">-100</button>
          <button onclick="changeScore('s1', currentValue)">+Tile</button>
        </div>
      </div>

      <div class="team">
        <span class="team-name">Team 2</span>
        <span class="score" id="s2">0</span>
        <div class="score-btns">
          <button onclick="changeScore('s2', 100)">+100</button>
          <button onclick="changeScore('s2', -100)">-100</button>
          <button onclick="changeScore('s2', currentValue)">+Tile</button>
        </div>
      </div>

      <div class="team">
        <span class="team-name">Team 3</span>
        <span class="score" id="s3">0</span>
        <div class="score-btns">
          <button onclick="changeScore('s3', 100)">+100</button>
          <button onclick="changeScore('s3', -100)">-100</button>
          <button onclick="changeScore('s3', currentValue)">+Tile</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-q">
    <div class="modal-card">
      <div class="modal-topline">
        <span class="badge" id="modal-category">Category</span>
        <span class="badge" id="modal-value">100 Points</span>
      </div>

      <div class="modal-content" id="modal-q">Question text goes here?</div>
      <div class="answer-text" id="modal-a">Answer goes here!</div>

      <div class="modal-actions">
        <button class="btn answer" onclick="showAnswer()">Show Answer</button>
        <button class="btn used" onclick="markUsedAndClose()">Mark Used & Back to Board</button>
        <button class="btn close" onclick="closeModal()">Back Without Marking</button>
      </div>
    </div>
  </div>

  <script>
    const categories = [
      "Figurative Language",
      "Plot & Story",
      "Informational Text",
      "Context Clues & Roots",
      "Mixed Bag"
    ];

    const gameData = [
      // Col 1: Figurative Language
      { q: "Giving human qualities to non-human things.", a: "What is Personification?", v: 100 },
      { q: "A comparison using 'like' or 'as'.", a: "What is a Simile?", v: 200 },
      { q: "An extreme exaggeration (e.g., 'I could eat a horse').", a: "What is Hyperbole?", v: 300 },
      { q: "A direct comparison NOT using 'like' or 'as'.", a: "What is a Metaphor?", v: 400 },
      { q: "Repetition of beginning consonant sounds.", a: "What is Alliteration?", v: 500 },

      // Col 2: Plot & Story
      { q: "The lesson or universal message of a story.", a: "What is Theme?", v: 100 },
      { q: "Perspective of the narrator (1st or 3rd).", a: "What is Point of View?", v: 200 },
      { q: "The turning point or most exciting part.", a: "What is Climax?", v: 300 },
      { q: "The introduction of characters and setting.", a: "What is Exposition?", v: 400 },
      { q: "A struggle between two opposing forces.", a: "What is Conflict?", v: 500 },

      // Col 3: Informational Text
      { q: "Text structure explaining similarities and differences.", a: "What is Compare and Contrast?", v: 100 },
      { q: "Description placed under a photo.", a: "What is a Caption?", v: 200 },
      { q: "Structure explaining an event and its results.", a: "What is Cause and Effect?", v: 300 },
      { q: "The author's main point or focus.", a: "What is Main Idea/Central Idea?", v: 400 },
      { q: "Information set apart from the main article, often in a box.", a: "What is a Sidebar?", v: 500 },

      // Col 4: Context Clues
      { q: "Word part added to the beginning of a base word.", a: "What is a Prefix?", v: 100 },
      { q: "Using surrounding words to find a meaning.", a: "What are Context Clues?", v: 200 },
      { q: "If 'bio' means life and 'logy' means study, this is 'Biology'.", a: "What is the study of life?", v: 300 },
      { q: "Word part added to the end of a word.", a: "What is a Suffix?", v: 400 },
      { q: "A word that means the opposite.", a: "What is an Antonym?", v: 500 },

      // Col 5: Mixed Bag
      { q: "Words that sound the same but differ in spelling/meaning.", a: "What are Homophones?", v: 100 },
      { q: "The emotional atmosphere created for the reader.", a: "What is Mood?", v: 200 },
      { q: "An educated guess based on evidence.", a: "What is an Inference?", v: 300 },
      { q: "PIED: Persuade, Inform, Entertain, Describe.", a: "What is Author's Purpose?", v: 400 },
      { q: "Language that appeals to the 5 senses.", a: "What is Sensory Imagery?", v: 500 }
    ];

    const board = document.getElementById("board");
    const modal = document.getElementById("modal");
    const modalQ = document.getElementById("modal-q");
    const modalA = document.getElementById("modal-a");
    const modalCategory = document.getElementById("modal-category");
    const modalValue = document.getElementById("modal-value");

    let currentCard = null;
    let currentValue = 0;

    function buildBoard() {
      const existingCards = board.querySelectorAll(".question-card");
      existingCards.forEach(card => card.remove());

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const index = col * 5 + row;
          const item = gameData[index];
          const card = document.createElement("button");
          card.type = "button";
          card.className = "question-card";
          card.innerText = item.v;
          card.setAttribute("aria-label", categories[col] + " for " + item.v + " points");
          card.onclick = () => openQuestion(item, card, categories[col]);
          board.appendChild(card);
        }
      }
    }

    function openQuestion(item, card, category) {
      if (card.classList.contains("used")) return;

      currentCard = card;
      currentValue = item.v;

      modalCategory.innerText = category;
      modalValue.innerText = item.v + " Points";
      modalQ.innerText = item.q;
      modalA.innerText = item.a;
      modalA.classList.remove("visible");
      modal.classList.add("open");
    }

    function showAnswer() {
      modalA.classList.add("visible");
    }

    function closeModal() {
      modal.classList.remove("open");
      modalA.classList.remove("visible");
    }

    function markUsedAndClose() {
      if (currentCard) {
        currentCard.classList.add("used");
      }
      closeModal();
    }

    function changeScore(teamId, amount) {
      const scoreEl = document.getElementById(teamId);
      const currentScore = parseInt(scoreEl.innerText, 10) || 0;
      scoreEl.innerText = currentScore + amount;
    }

    function resetGame() {
      const confirmReset = confirm("Reset the board and all team scores?");
      if (!confirmReset) return;

      document.querySelectorAll(".question-card").forEach(card => {
        card.classList.remove("used");
      });

      document.getElementById("s1").innerText = "0";
      document.getElementById("s2").innerText = "0";
      document.getElementById("s3").innerText = "0";
      closeModal();
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
      if (event.key.toLowerCase() === "a" && modal.classList.contains("open")) showAnswer();
      if (event.key.toLowerCase() === "u" && modal.classList.contains("open")) markUsedAndClose();
    });

    buildBoard();
  </script>
</body>
</html>
