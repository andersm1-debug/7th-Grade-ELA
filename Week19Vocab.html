<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEEK 19: SUFFIX PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0b0f19;
            background-image: linear-gradient(rgba(255, 183, 3, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 183, 3, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #c9d1d9;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #lab-container {
            background: rgba(11, 15, 25, 0.95);
            border: 2px solid #212d40;
            border-top: 8px solid #ffb703;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .hub-link {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .hub-link:hover { color: #ffb703; }

        .lab-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-align: center;
            margin: 20px 0 5px 0;
            color: #ffb703;
            letter-spacing: 2px;
        }
        
        .sub-title {
            text-align: center;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Live Word Bank - Defaults to hidden until a Cloze question appears */
        #word-bank {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: #111827;
            border: 1px solid #374151;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .bank-word {
            background: #1f2937;
            color: #ffb703;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9rem;
            border: 1px solid #374151;
            transition: 0.3s;
        }

        .bank-word.used {
            text-decoration: line-through;
            color: #4b5563;
            border-color: #1f2937;
            background: transparent;
        }

        #format-label {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            color: #ffb703;
            font-size: 1rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .question-box {
            background: transparent;
            padding: 10px 20px 20px 20px;
            margin-bottom: 20px;
            color: #e5e7eb;
            font-size: 1.4rem;
            line-height: 1.8;
            text-align: center;
        }

        .highlight-blank {
            display: inline-block;
            width: 150px;
            border-bottom: 2px dashed #ffb703;
            margin: 0 10px;
            color: #ffb703;
        }

        /* Multiple Choice Options */
        #mcq-options {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 18px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: #ffb703;
            color: #0b0f19;
            border-color: #ffb703;
            transform: translateX(5px);
        }

        /* Terminal Input Area */
        #cloze-input-area {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        #cloze-input {
            background: #0b0f19;
            border: 1px solid #ffb703;
            color: #ffb703;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            border-radius: 4px;
            width: 50%;
            text-align: center;
            text-transform: uppercase;
        }

        #cloze-input:focus { outline: none; box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }

        #submit-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        #submit-btn:hover { filter: brightness(1.2); }

        /* Feedback Modal */
        #feedback-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .next-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            border-radius: 4px;
            font-weight: bold;
        }

        #progress-bar { width: 100%; height: 6px; background: #1f2937; margin-bottom: 20px; border-radius: 3px; }
        #progress-fill { height: 100%; background: #ffb703; width: 0%; transition: width 0.3s; }

    </style>
</head>
<body>

<div id="lab-container">
    <a href="index.html" class="hub-link">← Return to Hub</a>
    <h1 class="lab-title">SUFFIX PROTOCOL</h1>
    <p class="sub-title">WEEK 19: -ABLE | -IBLE | -Y | -SHIP | -NESS</p>
    
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="word-bank">
        </div>

    <div id="quiz-content">
        <div id="format-label">MODE: INITIALIZING...</div>
        <div id="text-display" class="question-box">LOADING DATA...</div>
        
        <div id="mcq-options"></div>

        <div id="cloze-input-area">
            <input type="text" id="cloze-input" placeholder="ENTER OVERRIDE CODE..." autocomplete="off">
            <button id="submit-btn" onclick="checkClozeAnswer()">SUBMIT</button>
        </div>
    </div>
</div>

<div id="feedback-modal">
    <h1 id="fb-status" style="font-family:'Orbitron'; font-size: 3rem;"></h1>
    <p id="fb-info" style="font-size: 1.2rem; max-width: 600px; color: #d1d5db; padding: 20px; line-height: 1.6;"></p>
    <button class="next-btn" onclick="nextQuestion()">CONTINUE</button>
</div>

<script>
    const allWords = [
        "Capable", "Sensible", "Reliable", "Healthy", "Wealthy", 
        "Trendy", "Relationship", "Hardship", "Leadership", "Happiness", 
        "Loneliness", "Bitterness", "Debatable", "Farsightedness", "Feasible"
    ];

    // 20 Multiple Choice Questions
    const rawMCQ = [
        { type: "mcq", text: "What does it mean if someone is <b>capable</b>?", choices: [ { text: "They have the power and ability to do something.", correct: true }, { text: "They are completely unable to learn.", correct: false }, { text: "They are always tired and sluggish.", correct: false } ], explanation: "To be capable means you are ABLE to do something successfully." },
        { type: "mcq", text: "Which of the following is an example of a <b>sensible</b> action?", choices: [ { text: "Bringing an umbrella when the forecast predicts heavy rain.", correct: true }, { text: "Leaving your front door wide open overnight.", correct: false }, { text: "Eating a rock you found on the ground.", correct: false } ], explanation: "A sensible choice is one made with wisdom and prudence; it just makes sense!" },
        { type: "mcq", text: "A machine that is <b>reliable</b> is...", choices: [ { text: "Deserving of trust and dependable.", correct: true }, { text: "Constantly breaking down.", correct: false }, { text: "Open to intense argument.", correct: false } ], explanation: "If something is reliable, you can rely on it to work every time." },
        { type: "mcq", text: "Which choice represents a <b>healthy</b> habit?", choices: [ { text: "Sleeping 8 hours a night and eating vegetables.", correct: true }, { text: "Drinking soda for every single meal.", correct: false }, { text: "Never washing your hands.", correct: false } ], explanation: "To be healthy means to be in a state of good physical and mental health." },
        { type: "mcq", text: "What is another word for <b>wealthy</b>?", choices: [ { text: "Rich.", correct: true }, { text: "Poor.", correct: false }, { text: "Angry.", correct: false } ], explanation: "Wealthy simply means having a great deal of money, resources, or assets." },
        { type: "mcq", text: "If a new song or outfit is described as <b>trendy</b>, it is...", choices: [ { text: "Relating to the latest style or very popular right now.", correct: true }, { text: "Written over 200 years ago.", correct: false }, { text: "Something that causes immense difficulty to bear.", correct: false } ], explanation: "Trendy things are following the current 'trend' or fad." },
        { type: "mcq", text: "The way in which two or more concepts or people are connected is called a...", choices: [ { text: "Relationship.", correct: true }, { text: "Hardship.", correct: false }, { text: "Farsightedness.", correct: false } ], explanation: "A relationship defines the connection between two entities." },
        { type: "mcq", text: "Which of the following is an example of a <b>hardship</b>?", choices: [ { text: "Enduring a long, severe drought with no access to clean water.", correct: true }, { text: "Winning the grand prize in a lottery.", correct: false }, { text: "Going to a fun party with your best friends.", correct: false } ], explanation: "A hardship is something that causes deep suffering or difficulty." },
        { type: "mcq", text: "The use of power and influence to direct followers toward a goal is called...", choices: [ { text: "Leadership.", correct: true }, { text: "Loneliness.", correct: false }, { text: "Bitterness.", correct: false } ], explanation: "Leadership is the ability to guide and direct others successfully." },
        { type: "mcq", text: "The state of being joyful and content is known as...", choices: [ { text: "Happiness.", correct: true }, { text: "Farsightedness.", correct: false }, { text: "Debatable.", correct: false } ], explanation: "Happiness is the emotional state of being happy." },
        { type: "mcq", text: "When might someone experience intense <b>loneliness</b>?", choices: [ { text: "When they have absolutely no friends or company around them.", correct: true }, { text: "When they are at a crowded concert with their closest friends.", correct: false }, { text: "When they are eating their favorite dessert.", correct: false } ], explanation: "Loneliness is the specific sadness that comes from being alone." },
        { type: "mcq", text: "A lingering feeling of disgust, resentment, or anger over a past wrong is known as...", choices: [ { text: "Bitterness.", correct: true }, { text: "Leadership.", correct: false }, { text: "Sensible.", correct: false } ], explanation: "Bitterness is a harsh, resentful feeling that is hard to let go of." },
        { type: "mcq", text: "If a fact or topic is <b>debatable</b>, it means...", choices: [ { text: "It is open to discussion, argument, and different opinions.", correct: true }, { text: "It is a proven law of gravity.", correct: false }, { text: "It is related to the newest fashion trend.", correct: false } ], explanation: "If it is debatable, it means people can debate or argue about it." },
        { type: "mcq", text: "What is the medical definition of <b>farsightedness</b>?", choices: [ { text: "Seeing distant objects clearly, but close objects appear blurry.", correct: true }, { text: "Being completely blind in both eyes.", correct: false }, { text: "Only seeing objects that are very close to your face.", correct: false } ], explanation: "Farsightedness literally means you have 'far sight' (you can see far away) but struggle up close." },
        { type: "mcq", text: "If an engineering plan is highly <b>feasible</b>, it is...", choices: [ { text: "Possible and able to be done practically.", correct: true }, { text: "Completely impossible to achieve with current technology.", correct: false }, { text: "A state of profound sadness.", correct: false } ], explanation: "Feasible means capable of being done or carried out." },
        { type: "mcq", text: "Which of these objects is the most <b>reliable</b>?", choices: [ { text: "A sturdy, well-built bridge made of thick steel cables.", correct: true }, { text: "A paper umbrella in the middle of a hurricane.", correct: false }, { text: "A digital watch with a completely dead battery.", correct: false } ], explanation: "You can trust and depend on the steel bridge to hold you." },
        { type: "mcq", text: "Something that causes suffering or difficulty is specifically called a...", choices: [ { text: "Hardship.", correct: true }, { text: "Relationship.", correct: false }, { text: "Trendy.", correct: false } ], explanation: "A hardship makes life hard to bear." },
        { type: "mcq", text: "Which of the following goals is <b>feasible</b> for a typical middle school student?", choices: [ { text: "Finishing their homework on time and studying for a test.", correct: true }, { text: "Building a rocket ship and flying to the moon by tomorrow.", correct: false }, { text: "Buying a professional sports team for a billion dollars.", correct: false } ], explanation: "Doing homework is highly possible and practical (feasible)." },
        { type: "mcq", text: "If a modern computer is <b>capable</b> of running a new video game, it...", choices: [ { text: "Has the power, memory, and ability to play it smoothly.", correct: true }, { text: "Will instantly break if you try to turn the game on.", correct: false }, { text: "Is deeply resentful of the game's graphics.", correct: false } ], explanation: "Being capable means having the capacity to handle the task." },
        { type: "mcq", text: "Open to discussion or argument means something is...", choices: [ { text: "Debatable.", correct: true }, { text: "Wealthy.", correct: false }, { text: "Healthy.", correct: false } ], explanation: "If you can debate it, it is debatable." }
    ];

    // 15 Cloze Decryption Questions (Exactly one for each word in the bank)
    const rawCloze = [
        { type: "cloze", word: "Capable", sentence: "The mechanic is highly <span class='highlight-blank'></span> and can easily fix almost any engine problem you bring him.", explanation: "Because he is able to do the task, he is CAPABLE." },
        { type: "cloze", word: "Sensible", sentence: "Looking both ways before you cross a busy street is a very <span class='highlight-blank'></span> decision.", explanation: "It is a wise and prudent action, making it SENSIBLE." },
        { type: "cloze", word: "Reliable", sentence: "My old car is very <span class='highlight-blank'></span>; it starts every single morning without fail, even in the freezing cold.", explanation: "Because it is dependable and trustworthy, it is RELIABLE." },
        { type: "cloze", word: "Healthy", sentence: "Eating a balanced diet and exercising regularly will help keep your heart <span class='highlight-blank'></span>.", explanation: "These actions keep you in a state of good physical well-being, meaning you are HEALTHY." },
        { type: "cloze", word: "Wealthy", sentence: "The extremely <span class='highlight-blank'></span> businessman donated three million dollars to build a new library.", explanation: "Having a lot of riches and money makes someone WEALTHY." },
        { type: "cloze", word: "Trendy", sentence: "The new clothing boutique at the mall sells all the latest, <span class='highlight-blank'></span> outfits that everyone wants right now.", explanation: "Because they relate to the latest style or fad, they are TRENDY." },
        { type: "cloze", word: "Relationship", sentence: "The two neighboring countries have a strong <span class='highlight-blank'></span> and trade goods peacefully across their borders.", explanation: "The state of being connected to one another is a RELATIONSHIP." },
        { type: "cloze", word: "Hardship", sentence: "Losing their home in the flood was a terrible <span class='highlight-blank'></span> for the family to overcome.", explanation: "A condition that causes suffering and is hard to bear is a HARDSHIP." },
        { type: "cloze", word: "Leadership", sentence: "Under the general's strong <span class='highlight-blank'></span>, the troops successfully completed the difficult mission.", explanation: "Directing followers toward a goal requires LEADERSHIP." },
        { type: "cloze", word: "Happiness", sentence: "The little girl's face was filled with pure <span class='highlight-blank'></span> when she saw the new puppies in the box.", explanation: "The state of being happy is HAPPINESS." },
        { type: "cloze", word: "Loneliness", sentence: "After moving to a new city where he knew absolutely no one, he felt a deep sense of <span class='highlight-blank'></span>.", explanation: "The sadness of having no friends or company is LONELINESS." },
        { type: "cloze", word: "Bitterness", sentence: "She couldn't hide her <span class='highlight-blank'></span> after being unfairly passed over for the promotion she worked so hard for.", explanation: "A lingering feeling of resentment or disgust is BITTERNESS." },
        { type: "cloze", word: "Debatable", sentence: "Whether or not pineapple actually belongs on pizza is a highly <span class='highlight-blank'></span> topic in our cafeteria.", explanation: "Because it is open to intense discussion and argument, it is DEBATABLE." },
        { type: "cloze", word: "Farsightedness", sentence: "Because of his <span class='highlight-blank'></span>, he needs reading glasses to see his phone screen, but he can see the distant mountains perfectly.", explanation: "Seeing distant objects clearly but close objects blurry is FARSIGHTEDNESS." },
        { type: "cloze", word: "Feasible", sentence: "Building a small wooden bridge across the tiny stream is a very <span class='highlight-blank'></span> construction project.", explanation: "Because it is possible and able to be done, it is FEASIBLE." }
    ];

    // Combine BOTH arrays and shuffle them into a 35-question gauntlet
    let allQuestions = [...rawMCQ, ...rawCloze].sort(() => Math.random() - 0.5);

    let currentIdx = 0;
    let score = 0;

    // Build the Word Bank
    const bankContainer = document.getElementById("word-bank");
    const sortedWords = [...allWords].sort();
    sortedWords.forEach(w => {
        const span = document.createElement("span");
        span.className = "bank-word";
        span.id = "bank-" + w.toLowerCase();
        span.innerText = w;
        bankContainer.appendChild(span);
    });

    function updateProgress() {
        const percentage = (currentIdx / allQuestions.length) * 100;
        document.getElementById("progress-fill").style.width = percentage + "%";
    }

    function loadQuestion() {
        updateProgress();
        const q = allQuestions[currentIdx];
        const display = document.getElementById("text-display");
        const mcqArea = document.getElementById("mcq-options");
        const clozeArea = document.getElementById("cloze-input-area");
        const formatLabel = document.getElementById("format-label");
        const wordBank = document.getElementById("word-bank");

        if (q.type === 'mcq') {
            formatLabel.innerText = "MODE: MULTIPLE CHOICE";
            formatLabel.style.color = "#8b949e";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.text}`;
            
            // Hide word bank and cloze input, show MCQ buttons
            wordBank.style.display = "none";
            clozeArea.style.display = "none";
            mcqArea.style.display = "flex";
            
            mcqArea.innerHTML = "";
            const scrambledChoices = [...q.choices].sort(() => Math.random() - 0.5);
            scrambledChoices.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerHTML = c.text;
                btn.onclick = () => checkMCQAnswer(c.correct, q.explanation);
                mcqArea.appendChild(btn);
            });

        } else if (q.type === 'cloze') {
            formatLabel.innerText = "MODE: CLOZE DECRYPTION";
            formatLabel.style.color = "#ffb703";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.sentence}`;
            
            // Hide MCQ buttons, show word bank and cloze input
            mcqArea.style.display = "none";
            wordBank.style.display = "flex";
            clozeArea.style.display = "flex";
            
            const input = document.getElementById("cloze-input");
            input.value = "";
            setTimeout(() => input.focus(), 100); 
        }
    }

    function checkMCQAnswer(isCorrect, explanation) {
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (isCorrect) {
            score++;
            status.innerText = "VERIFIED";
            status.style.color = "#3fb950"; 
        } else {
            status.innerText = "ERROR";
            status.style.color = "#f85149"; 
        }
        document.getElementById("fb-info").innerText = explanation;
        modal.style.display = "flex";
    }

    function checkClozeAnswer() {
        const inputVal = document.getElementById("cloze-input").value.trim().toLowerCase();
        const correctAns = allQuestions[currentIdx].word.toLowerCase();
        
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (inputVal === correctAns) {
            score++;
            status.innerText = "ACCESS GRANTED";
            status.style.color = "#3fb950"; 
            
            // Cross off the specific word in the bank so they know it has been used!
            const bankWord = document.getElementById("bank-" + correctAns);
            if(bankWord) bankWord.classList.add("used");
            
            document.getElementById("fb-info").innerText = "Correct! " + allQuestions[currentIdx].explanation;
        } else {
            status.innerText = "ACCESS DENIED";
            status.style.color = "#f85149"; 
            document.getElementById("fb-info").innerHTML = `Target sequence was: <b style="color:#ffb703;">${allQuestions[currentIdx].word}</b>.<br><br>${allQuestions[currentIdx].explanation}`;
        }
        
        modal.style.display = "flex";
    }

    function nextQuestion() {
        document.getElementById("feedback-modal").style.display = "none";
        currentIdx++;

        if (currentIdx < allQuestions.length) {
            loadQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("format-label").style.display = "none";
        document.getElementById("cloze-input-area").style.display = "none";
        document.getElementById("mcq-options").style.display = "none";
        document.getElementById("word-bank").style.display = "none";
        document.getElementById("quiz-content").innerHTML = `
            <div style="text-align:center; padding: 30px 0;">
                <h2 style="font-family:'Orbitron'; font-size: 2.5rem; color: #ffb703;">PROTOCOL COMPLETE</h2>
                <p style="font-size:3.5rem; margin:10px 0; font-family:'Share Tech Mono';">${Math.round((score/allQuestions.length)*100)}%</p>
                <p style="font-size: 1.2rem; color: #8b949e;">You scored ${score} out of ${allQuestions.length}.</p>
                <a href="index.html" class="next-btn" style="text-decoration:none; display:inline-block;">RETURN TO DASHBOARD</a>
            </div>`;
    }

    // Allow "Enter" key for submission, but ONLY on Cloze questions
    document.getElementById("cloze-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter" && allQuestions[currentIdx].type === 'cloze') {
            event.preventDefault();
            checkClozeAnswer();
        }
    });

    loadQuestion();
</script>
</body>
</html>
