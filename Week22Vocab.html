<script>
    const allWords = [
        "Cordial", "Millennial", "Industrial", "Commitment", 
        "Resentment", "Achievement", "Pendulums", "Chromosomes", 
        "Doctrines", "Federalism", "Colonialism", "Capitalism", 
        "Existentialism", "Enlightenment", "Counterproposal"
    ];

    // 25 Multiple Choice Questions
    const rawMCQ = [
        { type: "mcq", text: "What does it mean to be <span class='highlight'>cordial</span>?", choices: [ { text: "Warm and friendly.", correct: true }, { text: "Angry and hostile.", correct: false }, { text: "Relating to a thousand years.", correct: false } ], explanation: "The suffix -AL means 'pertaining to'. Cordial means pertaining to the heart, or being warm and friendly." },
        { type: "mcq", text: "Which definition best fits the word <span class='highlight'>millennial</span>?", choices: [ { text: "Relating to a period of a thousand years.", correct: true }, { text: "A hanging weight inside a clock.", correct: false }, { text: "An economic system.", correct: false } ], explanation: "Mille means thousand, and -IAL means pertaining to." },
        { type: "mcq", text: "If an area is described as <span class='highlight'>industrial</span>, it is...", choices: [ { text: "Of, relating to, or characterized by industry.", correct: true }, { text: "A political philosophy.", correct: false }, { text: "A pledge or promise.", correct: false } ], explanation: "The suffix -AL makes it mean 'pertaining to industry'." },
        { type: "mcq", text: "What is a <span class='highlight'>commitment</span>?", choices: [ { text: "A pledge or promise.", correct: true }, { text: "A mistaken belief.", correct: false }, { text: "A hanging weight.", correct: false } ], explanation: "The suffix -MENT means 'the act of'. It is the act of committing to a pledge." },
        { type: "mcq", text: "The word <span class='highlight'>resentment</span> means a feeling of...", choices: [ { text: "Anger or displeasure about something unfair.", correct: true }, { text: "Complete happiness and joy.", correct: false }, { text: "Deep connection with nature.", correct: false } ], explanation: "Resentment is the result (-MENT) of resenting someone or something." },
        { type: "mcq", text: "Something done successfully through hard work is an <span class='highlight'>achievement</span>. The suffix -MENT means...", choices: [ { text: "The act of or result.", correct: true }, { text: "More than one.", correct: false }, { text: "Characteristic of.", correct: false } ], explanation: "An achievement is the result of achieving something." },
        { type: "mcq", text: "What do <span class='highlight'>pendulums</span> do?", choices: [ { text: "They are hanging weights that swing back and forth to regulate old clocks.", correct: true }, { text: "They hold DNA in the nucleus.", correct: false }, { text: "They emphasize science and reason.", correct: false } ], explanation: "The suffix -S means there is more than one pendulum." },
        { type: "mcq", text: "What are <span class='highlight'>chromosomes</span>?", choices: [ { text: "Threadlike structures made of DNA molecules that contain genes.", correct: true }, { text: "Hanging weights inside a clock.", correct: false }, { text: "Settlements established in another territory.", correct: false } ], explanation: "The suffix -S indicates plural structures containing DNA." },
        { type: "mcq", text: "What are <span class='highlight'>doctrines</span>?", choices: [ { text: "Principles, teachings, or beliefs.", correct: true }, { text: "Movements emphasizing science.", correct: false }, { text: "The plural of an economic system.", correct: false } ], explanation: "The suffix -ES means there is more than one doctrine or teaching." },
        { type: "mcq", text: "In <span class='highlight'>federalism</span>, power is...", choices: [ { text: "Divided between the national and state governments.", correct: true }, { text: "Held completely by one king or queen.", correct: false }, { text: "Given entirely to private businesses.", correct: false } ], explanation: "The suffix -ISM means a characteristic or system. It is the system of a divided federation." },
        { type: "mcq", text: "What is <span class='highlight'>colonialism</span>?", choices: [ { text: "An attempt by one country to establish settlements in another territory.", correct: true }, { text: "A promise to do something.", correct: false }, { text: "Threadlike DNA structures.", correct: false } ], explanation: "It is the system (-ISM) of establishing colonies." },
        { type: "mcq", text: "An economic system based on private property and free enterprise is...", choices: [ { text: "Capitalism.", correct: true }, { text: "Existentialism.", correct: false }, { text: "Federalism.", correct: false } ], explanation: "Capitalism allows individuals to own capital (property and money)." },
        { type: "mcq", text: "The philosophy that people give meaning to their lives through choices is called...", choices: [ { text: "Existentialism.", correct: true }, { text: "Colonialism.", correct: false }, { text: "Capitalism.", correct: false } ], explanation: "Existentialism focuses on individual existence and choices." },
        { type: "mcq", text: "The movement that emphasized science and reason as guides to see the world more clearly was the...", choices: [ { text: "Enlightenment.", correct: true }, { text: "Resentment.", correct: false }, { text: "Millennial.", correct: false } ], explanation: "The Enlightenment brought 'light' (reason and science) to the world." },
        { type: "mcq", text: "A <span class='highlight'>counterproposal</span> is used to...", choices: [ { text: "Amend the terms and conditions of a proposed contract.", correct: true }, { text: "Study living things in an ecosystem.", correct: false }, { text: "Swing back and forth to keep time.", correct: false } ], explanation: "It is a proposal made against (counter) an original proposal." },
        { type: "mcq", text: "The suffix <b>-ISM</b> generally means...", choices: [ { text: "Characteristic of or a system of.", correct: true }, { text: "More than one (plural).", correct: false }, { text: "The act of doing something.", correct: false } ], explanation: "Words ending in -ISM are usually philosophies, systems, or characteristics." },
        { type: "mcq", text: "The suffix <b>-MENT</b> generally means...", choices: [ { text: "The act of, or the result.", correct: true }, { text: "Pertaining to.", correct: false }, { text: "A person who does something.", correct: false } ], explanation: "Examples include achieveMENT (result of achieving) and resenTMENT." },
        { type: "mcq", text: "If a word ends in <b>-AL</b> or <b>-IAL</b>, it most likely means...", choices: [ { text: "Pertaining to or relating to.", correct: true }, { text: "More than one.", correct: false }, { text: "A state of being.", correct: false } ], explanation: "Industrial means 'pertaining to industry'." },
        { type: "mcq", text: "The suffixes <b>-S</b> and <b>-ES</b> indicate that a noun is...", choices: [ { text: "Plural (more than one).", correct: true }, { text: "A complex philosophy.", correct: false }, { text: "An action or result.", correct: false } ], explanation: "Chromosomes, pendulums, and doctrines are all plural." },
        { type: "mcq", text: "Which word is an antonym (opposite) of <span class='highlight'>cordial</span>?", choices: [ { text: "Hostile", correct: true }, { text: "Friendly", correct: false }, { text: "Industrial", correct: false } ], explanation: "Cordial means warm and friendly, so hostile is the opposite." },
        { type: "mcq", text: "Which word is a synonym (same) for <span class='highlight'>commitment</span>?", choices: [ { text: "Promise", correct: true }, { text: "Resentment", correct: false }, { text: "Philosophy", correct: false } ], explanation: "A commitment is a pledge or a promise." },
        { type: "mcq", text: "While capitalism is an economic system, <span class='highlight'>federalism</span> is...", choices: [ { text: "A political system dividing government power.", correct: true }, { text: "A philosophy of personal choices.", correct: false }, { text: "A scientific movement.", correct: false } ], explanation: "Federalism divides power between national and state governments." },
        { type: "mcq", text: "The <span class='highlight'>Enlightenment</span> period heavily relied on what two concepts?", choices: [ { text: "Science and reason.", correct: true }, { text: "Fear and anger.", correct: false }, { text: "Private property and free enterprise.", correct: false } ], explanation: "It was an intellectual movement focused on science and reason." },
        { type: "mcq", text: "A church, political party, or government is most likely to publish its...", choices: [ { text: "Doctrines.", correct: true }, { text: "Pendulums.", correct: false }, { text: "Chromosomes.", correct: false } ], explanation: "Doctrines are the official principles, teachings, or beliefs." },
        { type: "mcq", text: "
