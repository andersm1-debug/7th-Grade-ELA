
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Autobiography", hint: "Root: AUTO (Self)", definition: "A book written about the author by the author", sentence: "In her ______, the pilot described her first flight across the ocean.", options: ["Aqueduct", "Autobiography", "Terrain", "Conduct"] },
            { word: "Chronometer", hint: "Root: CHRONO (Time)", definition: "A clock that keeps accurate time", sentence: "The captain checked the ______ to calculate the ship's exact position.", options: ["Terra cotta", "Automation", "Chronometer", "Extraterrestrial"] },
            { word: "Terrarium", hint: "Root: TERR (Earth)", definition: "A small enclosure where land animals are kept", sentence: "We put moss and a small lizard inside the glass ______.", options: ["Terrarium", "Autograph", "Viaduct", "Chronological"] },
            { word: "Extraterrestrial", hint: "Root: TERR (Earth)", definition: "From outside the earth's atmosphere", sentence: "The scientists searched the sky for any signs of ______ life.", options: ["Abduct", "Extraterrestrial", "Automotive", "Subterranean"] },
            { word: "Automotive", hint: "Root: AUTO (Self)", definition: "Self-propelled; to move by oneself", sentence: "Detroit is famous for being a hub of the ______ industry.", options: ["Subterranean", "Conduct", "Autobiography", "Automotive"] },
            { word: "Terrain", hint: "Root: TERR (Earth)", definition: "Physical features of a stretch of land", sentence: "The rocky ______ made it difficult for the hikers to climb the mountain.", options: ["Terrain", "Aqueduct", "Chronometer", "Terra cotta"] },
            { word: "Aqueduct", hint: "Root: DUC (To lead)", definition: "Structure that leads water", sentence: "The ancient Romans built a massive ______ to bring water to the city.", options: ["Autograph", "Terrarium", "Aqueduct", "Automation"] },
            { word: "Terra cotta", hint: "Root: TERR (Earth)", definition: "A reddish brown earthenware", sentence: "We planted the flowers in beautiful ______ pots on the patio.", options: ["Extraterrestrial", "Terra cotta", "Viaduct", "Chronological"] },
            { word: "Autograph", hint: "Root: AUTO (Self)", definition: "One’s own signature", sentence: "After the play, the actor stayed to give his ______ to the fans.", options: ["Automotive", "Abduct", "Subterranean", "Autograph"] },
            { word: "Abduct", hint: "Root: DUC (To lead)", definition: "To lead someone away; to kidnap", sentence: "In the movie, the villains tried to ______ the prince for a ransom.", options: ["Abduct", "Autobiography", "Conduct", "Terrain"] },
            { word: "Conduct", hint: "Root: DUC (To lead)", definition: "To lead together", sentence: "The maestro will ______ the orchestra during the final performance.", options: ["Aqueduct", "Chronometer", "Conduct", "Terrarium"] },
            { word: "Chronological", hint: "Root: CHRONO (Time)", definition: "In the order in which events occurred", sentence: "Please list the history of the war in ______ order.", options: ["Chronological", "Extraterrestrial", "Terra cotta", "Automation"] },
            { word: "Subterranean", hint: "Root: TERR (Earth)", definition: "Under the earth’s surface", sentence: "The miners spent all day working in the ______ tunnels.", options: ["Viaduct", "Autograph", "Subterranean", "Automotive"] },
            { word: "Viaduct", hint: "Root: DUC (To lead)", definition: "To lead over (a long bridge)", sentence: "The train crossed the valley on a towering stone ______.", options: ["Abduct", "Viaduct", "Autobiography", "Conduct"] },
            { word: "Automation", hint: "Root: AUTO (Self)", definition: "Someone who acts in a mechanical way", sentence: "He was so tired that he moved through his chores like an ______.", options: ["Automation", "Terrain", "Aqueduct", "Chronometer"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
