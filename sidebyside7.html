
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Command", hint: "Root: MAND (Order)", definition: "To give an authoritative order", sentence: "The captain had to ______ the crew to prepare for the storm.", options: ["Photocopy", "Command", "Empathy", "Centrist"] },
            { word: "Demand", hint: "Root: MAND (Order)", definition: "To ask for something forcefully and as if it is your right", sentence: "The customers began to ______ a refund when the product failed to work.", options: ["Philosopher", "Heliocentric", "Demand", "Sympathy"] },
            { word: "Mandatory", hint: "Root: MAND (Order)", definition: "Required by laws or rules; something that must be done", sentence: "Wearing a seatbelt is ______ in almost every state for safety reasons.", options: ["Mandatory", "Pathology", "Photography", "Geocentric"] },
            { word: "Empathy", hint: "Root: PATH (Feel/Disease)", definition: "The ability to understand and share the feelings of another", sentence: "Because she had been through it too, she felt great ______ for her friend.", options: ["Sophisticated", "Photophobia", "Command", "Empathy"] },
            { word: "Photography", hint: "Root: PHOTO (Light)", definition: "Production of an image by the action of light", sentence: "She turned her hobby of ______ into a professional career.", options: ["Demand", "Centrist", "Photography", "Photosynthesis"] },
            { word: "Heliocentric", hint: "Root: CENTRI (Center)", definition: "Relating to a model of the solar system where the sun is at the center", sentence: "The ______ theory changed how humans viewed our place in the universe.", options: ["Mandatory", "Heliocentric", "Sympathy", "Philosopher"] },
            { word: "Sympathy", hint: "Root: PATH (Feel/Disease)", definition: "Feelings of pity and sorrow for someone else’s misfortune", sentence: "We sent a card to express our ______ after the loss of their pet.", options: ["Command", "Sympathy", "Photocopy", "Geocentric"] },
            { word: "Geocentric", hint: "Root: CENTRI (Center)", definition: "Earth as the center of the universe", sentence: "Ancient civilizations once believed in a ______ model of the sky.", options: ["Empathy", "Demand", "Geocentric", "Pathology"] },
            { word: "Centrist", hint: "Root: CENTRI (Center)", definition: "A person whose political opinions are moderate or in the middle", sentence: "The candidate hoped to win over the ______ voters by avoiding extreme views.", options: ["Centrist", "Photography", "Photophobia", "Sophisticated"] },
            { word: "Philosopher", hint: "Root: SOPH (Wisdom)", definition: "A person who studies ideas about knowledge, truth, and right and wrong", sentence: "The ancient ______ Plato wrote about the ideal form of government.", options: ["Heliocentric", "Mandatory", "Philosopher", "Photosynthesis"] },
            { word: "Pathology", hint: "Root: PATH (Feel/Disease)", definition: "The scientific study of the causes and effects of diseases", sentence: "The lab results were sent to the ______ department for further testing.", options: ["Sympathy", "Pathology", "Command", "Centrist"] },
            { word: "Sophisticated", hint: "Root: SOPH (Wisdom)", definition: "Highly complex or advanced; having great worldly experience", sentence: "The new AI system is incredibly ______ and can solve complex math in seconds.", options: ["Geocentric", "Demand", "Sophisticated", "Photocopy"] },
            { word: "Photophobia", hint: "Roots: PHOTO (Light) & PATH (Disease)", definition: "An extreme sensitivity to light", sentence: "The migraine caused him to suffer from ______, so he stayed in a dark room.", options: ["Empathy", "Photophobia", "Photography", "Philosopher"] },
            { word: "Photocopy", hint: "Root: PHOTO (Light)", definition: "A duplicate of a document or image made by a machine", sentence: "I need to make a ______ of my ID for the application.", options: ["Heliocentric", "Mandatory", "Photocopy", "Pathology"] },
            { word: "Photosynthesis", hint: "Root: PHOTO (Light)", definition: "The process used by plants to convert light energy into chemical energy", sentence: "Without ______, plants would not be able to create the food they need to grow.", options: ["Sympathy", "Sophisticated", "Photosynthesis", "Geocentric"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
