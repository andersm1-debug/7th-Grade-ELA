
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Jurisdiction", hint: "Root: JUR / JUS (Law)", definition: "The official power to make legal decisions and judgments", sentence: "The local police do not have ______ over crimes committed on federal land.", options: ["Manual", "Jurisdiction", "Jurist", "Invisible"] },
            { word: "Visual", hint: "Root: VIS / VID (See)", definition: "Relating to seeing or sight", sentence: "The presentation included several ______ aids to help the audience understand the data.", options: ["Manicures", "Vivid", "Visual", "Perjure"] },
            { word: "Manicures", hint: "Root: MAN (Hand)", definition: "A cosmetic treatment of the hands", sentence: "She treats herself to regular ______ to keep her nails looking neat.", options: ["Manicures", "Videotape", "Jurors", "Visionary"] },
            { word: "Jurist", hint: "Root: JUR / JUS (Law)", definition: "A lawyer or judge", sentence: "The respected ______ was known for her fair and balanced rulings.", options: ["Maladjusted", "Jurisdiction", "Manual", "Jurist"] },
            { word: "Videotape", hint: "Root: VIS / VID (See)", definition: "A device used for recording and showing audio sound and visual images", sentence: "In the 90s, we used to ______ our favorite shows on VHS.", options: ["Videotape", "Manacle", "Visual", "Justice"] },
            { word: "Manuscript", hint: "Root: MAN (Hand)", definition: "Something written by hand", sentence: "The author spent years working on the ______ for his first novel.", options: ["Perjure", "Manuscript", "Invisible", "Jurors"] },
            { word: "Perjure", hint: "Root: JUR / JUS (Law)", definition: "Willfully telling a lie while testifying in court", sentence: "If you lie under oath, you ______ yourself and face legal trouble.", options: ["Vivid", "Manicures", "Perjure", "Visionary"] },
            { word: "Vivid", hint: "Root: VIS / VID (See)", definition: "Producing clear images in the mind", sentence: "Her ______ description of the tropical island made me feel like I was there.", options: ["Jurist", "Videotape", "Maladjusted", "Vivid"] },
            { word: "Justice", hint: "Root: JUR / JUS (Law)", definition: "Being fair and reasonable", sentence: "The judge's goal is to ensure that ______ is served for everyone involved.", options: ["Justice", "Manuscript", "Jurisdiction", "Manacle"] },
            { word: "Manual", hint: "Root: MAN (Hand)", definition: "Relating to or done with the hands", sentence: "Farming used to require a lot of ______ labor before machines were invented.", options: ["Visual", "Manual", "Perjure", "Invisible"] },
            { word: "Jurors", hint: "Root: JUR / JUS (Law)", definition: "A group of people that take an oath and decide on the facts of trials", sentence: "The ______ listened carefully to all the evidence before reaching a verdict.", options: ["Jurors", "Vivid", "Videotape", "Manicures"] },
            { word: "Manacle", hint: "Root: MAN (Hand)", definition: "Handcuffs", sentence: "The officer had to ______ the suspect to prevent him from escaping.", options: ["Jurist", "Manacle", "Justice", "Visionary"] },
            { word: "Visionary", hint: "Root: VIS / VID (See)", definition: "Thinking about or planning the future with imagination or wisdom", sentence: "The CEO was a ______ who predicted the rise of the internet years early.", options: ["Manuscript", "Maladjusted", "Visionary", "Jurors"] },
            { word: "Invisible", hint: "Root: VIS / VID (See)", definition: "Not able to be seen", sentence: "The ink was ______ until we held the paper up to a heat source.", options: ["Perjure", "Visual", "Manacle", "Invisible"] },
            { word: "Maladjusted", hint: "Root: JUR / JUS (Law)", definition: "Unable to cope with the demands of a normal social environment", sentence: "The puppy was ______ after being alone for so long and needed training.", options: ["Maladjusted", "Manual", "Vivid", "Jurisdiction"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
