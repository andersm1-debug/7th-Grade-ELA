<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEEK 21: SUFFIX PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0b0f19;
            background-image: linear-gradient(rgba(255, 183, 3, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 183, 3, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #c9d1d9;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #lab-container {
            background: rgba(11, 15, 25, 0.95);
            border: 2px solid #212d40;
            border-top: 8px solid #ffb703;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .hub-link {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .hub-link:hover { color: #ffb703; }

        .lab-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-align: center;
            margin: 20px 0 5px 0;
            color: #ffb703;
            letter-spacing: 2px;
        }
        
        .sub-title {
            text-align: center;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Live Word Bank - Defaults to hidden until a Cloze question appears */
        #word-bank {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: #111827;
            border: 1px solid #374151;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .bank-word {
            background: #1f2937;
            color: #ffb703;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9rem;
            border: 1px solid #374151;
            transition: 0.3s;
        }

        .bank-word.used {
            text-decoration: line-through;
            color: #4b5563;
            border-color: #1f2937;
            background: transparent;
        }

        #format-label {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            color: #ffb703;
            font-size: 1rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .question-box {
            background: transparent;
            padding: 10px 20px 20px 20px;
            margin-bottom: 20px;
            color: #e5e7eb;
            font-size: 1.4rem;
            line-height: 1.8;
            text-align: center;
        }

        .highlight { color: #ffb703; font-weight: bold; }
        .highlight-blank {
            display: inline-block;
            width: 150px;
            border-bottom: 2px dashed #ffb703;
            margin: 0 10px;
            color: #ffb703;
        }

        /* Multiple Choice Options */
        #mcq-options {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 18px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: #ffb703;
            color: #0b0f19;
            border-color: #ffb703;
            transform: translateX(5px);
        }

        /* Terminal Input Area */
        #cloze-input-area {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        #cloze-input {
            background: #0b0f19;
            border: 1px solid #ffb703;
            color: #ffb703;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            border-radius: 4px;
            width: 50%;
            text-align: center;
            text-transform: uppercase;
        }

        #cloze-input:focus { outline: none; box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }

        #submit-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        #submit-btn:hover { filter: brightness(1.2); }

        /* Feedback Modal */
        #feedback-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .next-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            border-radius: 4px;
            font-weight: bold;
        }

        #progress-bar { width: 100%; height: 6px; background: #1f2937; margin-bottom: 20px; border-radius: 3px; }
        #progress-fill { height: 100%; background: #ffb703; width: 0%; transition: width 0.3s; }

    </style>
</head>
<body>

<div id="lab-container">
    <a href="index.html" class="hub-link">← Return to Hub</a>
    <h1 class="lab-title">SUFFIX PROTOCOL</h1>
    <p class="sub-title">WEEK 21: -AL | -IZE | -IST | -ISE</p>
    
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="word-bank">
        </div>

    <div id="quiz-content">
        <div id="format-label">MODE: INITIALIZING...</div>
        <div id="text-display" class="question-box">LOADING DATA...</div>
        
        <div id="mcq-options"></div>

        <div id="cloze-input-area">
            <input type="text" id="cloze-input" placeholder="ENTER OVERRIDE CODE..." autocomplete="off">
            <button id="submit-btn" onclick="checkClozeAnswer()">SUBMIT</button>
        </div>
    </div>
</div>

<div id="feedback-modal">
    <h1 id="fb-status" style="font-family:'Orbitron'; font-size: 3rem;"></h1>
    <p id="fb-info" style="font-size: 1.2rem; max-width: 600px; color: #d1d5db; padding: 20px; line-height: 1.6;"></p>
    <button class="next-btn" onclick="nextQuestion()">CONTINUE</button>
</div>

<script>
    const allWords = [
        "Professional", "Lethal", "Vocal", "Biologist", 
        "Chemist", "Receptionist", "Pathologist", "Cardiologist", 
        "Socialize", "Revolutionize", "Individualize", "Comprise", 
        "Compromise", "Chastise", "Paleontologist"
    ];

    // 25 Multiple Choice Questions
    const rawMCQ = [
        { type: "mcq", text: "The suffix <b>-IST</b> means 'one who'. What does a <span class='highlight'>biologist</span> study?", choices: [ { text: "Living things and organisms.", correct: true }, { text: "Fossils and dinosaur bones.", correct: false }, { text: "Ailments of the heart.", correct: false } ], explanation: "Bio = life. A biologist is one who studies living things." },
        { type: "mcq", text: "If a substance is described as <span class='highlight'>lethal</span>, it is...", choices: [ { text: "Causing or capable of causing death.", correct: true }, { text: "A settlement where everyone gives up something.", correct: false }, { text: "Tailored to suit a specific individual.", correct: false } ], explanation: "Lethal means deadly." },
        { type: "mcq", text: "The suffix <b>-IZE</b> means 'make or become'. To <span class='highlight'>revolutionize</span> an industry means to...", choices: [ { text: "Completely change it.", correct: true }, { text: "Scold it severely.", correct: false }, { text: "Participate in a group event.", correct: false } ], explanation: "To revolutionize means to make a massive, complete change." },
        { type: "mcq", text: "Who is the person that usually greets visitors as they walk into an office building?", choices: [ { text: "Receptionist", correct: true }, { text: "Chemist", correct: false }, { text: "Pathologist", correct: false } ], explanation: "A receptionist is one who 'receives' or greets guests." },
        { type: "mcq", text: "What does a <span class='highlight'>pathologist</span> specialize in?", choices: [ { text: "The study of disease.", correct: true }, { text: "Chemical research and experiments.", correct: false }, { text: "The heart and its blood vessels.", correct: false } ], explanation: "Pathology is the science of the causes and effects of diseases." },
        { type: "mcq", text: "If your grandfather is having chest pains, which specialist should he visit?", choices: [ { text: "Cardiologist", correct: true }, { text: "Paleontologist", correct: false }, { text: "Biologist", correct: false } ], explanation: "Cardio = heart. A cardiologist is a doctor for ailments of the heart." },
        { type: "mcq", text: "The suffix <b>-AL</b> means 'relating to'. What does a <span class='highlight'>vocal</span> performance rely on?", choices: [ { text: "Relating to the voice.", correct: true }, { text: "Relating to chemical reactions.", correct: false }, { text: "Relating to fossils.", correct: false } ], explanation: "Vocal comes from 'vox' meaning voice." },
        { type: "mcq", text: "When you go to a party to <span class='highlight'>socialize</span>, you are...", choices: [ { text: "Participating in a group and talking to many people.", correct: true }, { text: "Working on chemical experiments alone.", correct: false }, { text: "Scolding someone severely.", correct: false } ], explanation: "To socialize means to make oneself social and mingle." },
        { type: "mcq", text: "What does it mean to <span class='highlight'>individualize</span> something?", choices: [ { text: "To tailor something to suit the specific individual.", correct: true }, { text: "To completely change everything about it.", correct: false }, { text: "To give up something to reach an agreement.", correct: false } ], explanation: "Individualize means to make something fit one individual perfectly." },
        { type: "mcq", text: "Which word means 'to consist of'?", choices: [ { text: "Comprise", correct: true }, { text: "Chastise", correct: false }, { text: "Socialize", correct: false } ], explanation: "If a puzzle is comprised of 500 pieces, it consists of them." },
        { type: "mcq", text: "What happens when two people reach a <span class='highlight'>compromise</span>?", choices: [ { text: "They settle their differences by each giving up something.", correct: true }, { text: "One person wins everything and the other gets nothing.", correct: false }, { text: "They completely change the rules of the game.", correct: false } ], explanation: "A compromise is a shared agreement where both sides bend a little." },
        { type: "mcq", text: "To <span class='highlight'>chastise</span> someone means to...", choices: [ { text: "Scold them severely or inflict punishment.", correct: true }, { text: "Greet them warmly at the front desk.", correct: false }, { text: "Study their fossilized remains.", correct: false } ], explanation: "To chastise is to reprimand or correct harsh behavior." },
        { type: "mcq", text: "A scientist who studies dinosaur bones and fossils is a...", choices: [ { text: "Paleontologist", correct: true }, { text: "Pathologist", correct: false }, { text: "Cardiologist", correct: false } ], explanation: "Paleo = ancient. A paleontologist studies ancient life forms through fossils." },
        { type: "mcq", text: "A <span class='highlight'>chemist</span> is a person engaged in...", choices: [ { text: "Chemical research or experiments.", correct: true }, { text: "Greeting visitors at an office.", correct: false }, { text: "Creating a settlement of differences.", correct: false } ], explanation: "A chemist works in a lab doing chemical research." },
        { type: "mcq", text: "Someone who claims to be an expert in their field and gets paid for it is a...", choices: [ { text: "Professional", correct: true }, { text: "Biologist", correct: false }, { text: "Receptionist", correct: false } ], explanation: "A professional is one who acts with expertise in their profession." },
        { type: "mcq", text: "Which of the following is an antonym (opposite) of <span class='highlight'>lethal</span>?", choices: [ { text: "Harmless", correct: true }, { text: "Deadly", correct: false }, { text: "Vocal", correct: false } ], explanation: "Harmless is the opposite of lethal (deadly)." },
        { type: "mcq", text: "Which of the following is a synonym (same) of <span class='highlight'>chastise</span>?", choices: [ { text: "Reprimand", correct: true }, { text: "Compromise", correct: false }, { text: "Socialize", correct: false } ], explanation: "To reprimand someone is to scold or chastise them." },
        { type: "mcq", text: "If the United States is <span class='highlight'>comprised</span> of 50 states, that means...", choices: [ { text: "It consists of or is made up of 50 states.", correct: true }, { text: "It is tailoring the states for an individual.", correct: false }, { text: "It completely changes the states.", correct: false } ], explanation: "To comprise means to be made up of." },
        { type: "mcq", text: "If a singer decides to perform an entirely <span class='highlight'>vocal</span> track, they will use...", choices: [ { text: "Only their voice, with no instruments.", correct: true }, { text: "A team of chemists.", correct: false }, { text: "A lethal combination of sounds.", correct: false } ], explanation: "Vocal relates strictly to the voice." },
        { type: "mcq", text: "Which specialist uses a microscope to study how a disease affects human cells?", choices: [ { text: "Pathologist", correct: true }, { text: "Paleontologist", correct: false }, { text: "Cardiologist", correct: false } ], explanation: "A pathologist studies the nature of diseases." },
        { type: "mcq", text: "If an athlete requires a custom training plan, their coach needs to <span class='highlight'>______</span> the workouts.", choices: [ { text: "Individualize", correct: true }, { text: "Chastise", correct: false }, { text: "Socialize", correct: false } ], explanation: "To individualize is to tailor it for that specific individual." },
        { type: "mcq", text: "A group of friends who can't agree on where to eat might need to find a...", choices: [ { text: "Compromise", correct: true }, { text: "Biologist", correct: false }, { text: "Professional", correct: false } ], explanation: "A compromise settles a disagreement." },
        { type: "mcq", text: "Which scientist would be most interested in a newly discovered jungle frog?", choices: [ { text: "Biologist", correct: true }, { text: "Chemist", correct: false }, { text: "Paleontologist", correct: false } ], explanation: "A biologist studies living organisms like frogs." },
        { type: "mcq", text: "The invention of the internet managed to <span class='highlight'>______</span> how humans access information.", choices: [ { text: "Revolutionize", correct: true }, { text: "Comprise", correct: false }, { text: "Chastise", correct: false } ], explanation: "It completely changed (revolutionized) access to information." },
        { type: "mcq", text: "At a networking event, business owners are encouraged to mingle and...", choices: [ { text: "Socialize", correct: true }, { text: "Compromise", correct: false }, { text: "Individualize", correct: false } ], explanation: "To socialize is to participate and talk in a group." }
    ];

    // 15 Cloze Questions (Exactly one for every word in the Word Bank)
    const rawCloze = [
        { type: "cloze", word: "Professional", sentence: "The mechanic was a true <span class='highlight-blank'></span>, completing the complex engine repair quickly and perfectly.", explanation: "Someone who acts as a skilled expert is a PROFESSIONAL." },
        { type: "cloze", word: "Lethal", sentence: "The snake's venom is <span class='highlight-blank'></span>, meaning a single bite can be deadly if untreated.", explanation: "Causing or capable of causing death means it is LETHAL." },
        { type: "cloze", word: "Vocal", sentence: "The singer's <span class='highlight-blank'></span> range was incredible, allowing her to hit both very low and extremely high notes.", explanation: "Relating to the voice is VOCAL." },
        { type: "cloze", word: "Biologist", sentence: "The marine <span class='highlight-blank'></span> spent months studying the migration patterns of blue whales in the ocean.", explanation: "A scientist who studies living things is a BIOLOGIST." },
        { type: "cloze", word: "Chemist", sentence: "The <span class='highlight-blank'></span> carefully mixed the two reactive liquids in the laboratory beaker.", explanation: "A person doing chemical experiments is a CHEMIST." },
        { type: "cloze", word: "Receptionist", sentence: "The friendly <span class='highlight-blank'></span> greeted us at the front desk and handed us our visitor badges.", explanation: "The person who receives and greets visitors is the RECEPTIONIST." },
        { type: "cloze", word: "Pathologist", sentence: "The <span class='highlight-blank'></span> examined the tissue sample under a microscope to determine the cause of the disease.", explanation: "A specialist in the study of disease is a PATHOLOGIST." },
        { type: "cloze", word: "Cardiologist", sentence: "After his heart attack, he had to visit a <span class='highlight-blank'></span> for specialized treatment and monitoring.", explanation: "A doctor specializing in the heart is a CARDIOLOGIST." },
        { type: "cloze", word: "Socialize", sentence: "After the long week of testing, the students were excited to <span class='highlight-blank'></span> with their friends at the school dance.", explanation: "To participate in a group and talk is to SOCIALIZE." },
        { type: "cloze", word: "Revolutionize", sentence: "The invention of the smartphone helped <span class='highlight-blank'></span> the way people communicate across the globe.", explanation: "To completely change something is to REVOLUTIONIZE it." },
        { type: "cloze", word: "Individualize", sentence: "The teacher tried to <span class='highlight-blank'></span> her lesson plans to fit the unique learning style of each student.", explanation: "To tailor something for one person is to INDIVIDUALIZE it." },
        { type: "cloze", word: "Comprise", sentence: "The United States of America is known to <span class='highlight-blank'></span> fifty distinct states.", explanation: "To consist of or be made up of means to COMPRISE." },
        { type: "cloze", word: "Compromise", sentence: "Since they wanted to watch different movies, they reached a <span class='highlight-blank'></span> and watched a comedy they both somewhat liked.", explanation: "A settlement where both sides give up something is a COMPROMISE." },
        { type: "cloze", word: "Chastise", sentence: "The coach had to <span class='highlight-blank'></span> the player for showing up late to practice for the third day in a row.", explanation: "To scold severely is to CHASTISE." },
        { type: "cloze", word: "Paleontologist", sentence: "The <span class='highlight-blank'></span> carefully brushed the dirt away from the newly discovered T-Rex skull.", explanation: "A scientist who studies fossils is a PALEONTOLOGIST." }
    ];

    // Combine BOTH arrays and shuffle them into a massive 40-question gauntlet
    let allQuestions = [...rawMCQ, ...rawCloze].sort(() => Math.random() - 0.5);

    let currentIdx = 0;
    let score = 0;

    // Build the Word Bank
    const bankContainer = document.getElementById("word-bank");
    const sortedWords = [...allWords].sort();
    sortedWords.forEach(w => {
        const span = document.createElement("span");
        span.className = "bank-word";
        span.id = "bank-" + w.toLowerCase();
        span.innerText = w;
        bankContainer.appendChild(span);
    });

    function updateProgress() {
        const percentage = (currentIdx / allQuestions.length) * 100;
        document.getElementById("progress-fill").style.width = percentage + "%";
    }

    function loadQuestion() {
        updateProgress();
        const q = allQuestions[currentIdx];
        const display = document.getElementById("text-display");
        const mcqArea = document.getElementById("mcq-options");
        const clozeArea = document.getElementById("cloze-input-area");
        const formatLabel = document.getElementById("format-label");
        const wordBank = document.getElementById("word-bank");

        if (q.type === 'mcq') {
            formatLabel.innerText = "MODE: MULTIPLE CHOICE";
            formatLabel.style.color = "#8b949e";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.text}`;
            
            // Hide word bank and cloze input, show MCQ buttons
            wordBank.style.display = "none";
            clozeArea.style.display = "none";
            mcqArea.style.display = "flex";
            
            mcqArea.innerHTML = "";
            const scrambledChoices = [...q.choices].sort(() => Math.random() - 0.5);
            scrambledChoices.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerHTML = c.text;
                btn.onclick = () => checkMCQAnswer(c.correct, q.explanation);
                mcqArea.appendChild(btn);
            });

        } else if (q.type === 'cloze') {
            formatLabel.innerText = "MODE: CLOZE DECRYPTION";
            formatLabel.style.color = "#ffb703";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.sentence}`;
            
            // Hide MCQ buttons, show word bank and cloze input
            mcqArea.style.display = "none";
            wordBank.style.display = "flex";
            clozeArea.style.display = "flex";
            
            const input = document.getElementById("cloze-input");
            input.value = "";
            setTimeout(() => input.focus(), 100); 
        }
    }

    function checkMCQAnswer(isCorrect, explanation) {
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (isCorrect) {
            score++;
            status.innerText = "VERIFIED";
            status.style.color = "#3fb950"; 
        } else {
            status.innerText = "ERROR";
            status.style.color = "#f85149"; 
        }
        document.getElementById("fb-info").innerText = explanation;
        modal.style.display = "flex";
    }

    function checkClozeAnswer() {
        const inputVal = document.getElementById("cloze-input").value.trim().toLowerCase();
        const correctAns = allQuestions[currentIdx].word.toLowerCase();
        
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (inputVal === correctAns) {
            score++;
            status.innerText = "ACCESS GRANTED";
            status.style.color = "#3fb950"; 
            
            // Cross off the specific word in the bank
            const bankWord = document.getElementById("bank-" + correctAns);
            if(bankWord) bankWord.classList.add("used");
            
            document.getElementById("fb-info").innerText = "Correct! " + allQuestions[currentIdx].explanation;
        } else {
            status.innerText = "ACCESS DENIED";
            status.style.color = "#f85149"; 
            document.getElementById("fb-info").innerHTML = `Target sequence was: <b style="color:#ffb703;">${allQuestions[currentIdx].word}</b>.<br><br>${allQuestions[currentIdx].explanation}`;
        }
        
        modal.style.display = "flex";
    }

    function nextQuestion() {
        document.getElementById("feedback-modal").style.display = "none";
        currentIdx++;

        if (currentIdx < allQuestions.length) {
            loadQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("format-label").style.display = "none";
        document.getElementById("cloze-input-area").style.display = "none";
        document.getElementById("mcq-options").style.display = "none";
        document.getElementById("word-bank").style.display = "none";
        document.getElementById("quiz-content").innerHTML = `
            <div style="text-align:center; padding: 30px 0;">
                <h2 style="font-family:'Orbitron'; font-size: 2.5rem; color: #ffb703;">PROTOCOL COMPLETE</h2>
                <p style="font-size:3.5rem; margin:10px 0; font-family:'Share Tech Mono';">${Math.round((score/allQuestions.length)*100)}%</p>
                <p style="font-size: 1.2rem; color: #8b949e;">You scored ${score} out of ${allQuestions.length}.</p>
                <a href="index.html" class="next-btn" style="text-decoration:none; display:inline-block;">RETURN TO DASHBOARD</a>
            </div>`;
    }

    // Allow "Enter" key for submission, but ONLY on Cloze questions
    document.getElementById("cloze-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter" && allQuestions[currentIdx].type === 'cloze') {
            event.preventDefault();
            checkClozeAnswer();
        }
    });

    loadQuestion();
</script>
</body>
</html>
