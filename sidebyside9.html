
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 9 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Omnivore", hint: "Root: OMNI- (All)", definition: "Eating both plants and animals", sentence: "Because the bear eats berries and fish, it is considered an ______.", options: ["Phonetics", "Omnivore", "Transcript", "Symphony"] },
            { word: "Omniscient", hint: "Root: OMNI- (All)", definition: "Knowing the thoughts and feelings of all", sentence: "The narrator of the story was ______, describing the secrets of every character.", options: ["Scribble", "Polyphony", "Omniscient", "Microphone"] },
            { word: "Phonetics", hint: "Root: PHON- (Sound)", definition: "The study of speech sounds", sentence: "To improve my accent, I started studying ______ to understand how sounds are made.", options: ["Phonetics", "Omnibus", "Inscribe", "Conscription"] },
            { word: "Inscribe", hint: "Root: SCRIB- (Write)", definition: "To carve, cut, or scratch onto a material", sentence: "The king ordered the mason to ______ his name into the stone monument.", options: ["Omnipresent", "Inscribe", "Euphony", "Phonograph"] },
            { word: "Prescribe", hint: "Root: SCRIB- (Write)", definition: "To authorize a course of action in writing before it is carried out", sentence: "The doctor will ______ a specific medicine to help you feel better.", options: ["Omniscient", "Prescribe", "Polyphony", "Microphone"] },
            { word: "Microphone", hint: "Root: PHON- (Sound)", definition: "A device that converts sound waves into an electrical signal", sentence: "The singer adjusted the ______ before starting the first song of the set.", options: ["Omnivore", "Transcript", "Microphone", "Prescribe"] },
            { word: "Omnipresent", hint: "Root: OMNI- (All)", definition: "Existing everywhere at once", sentence: "In some cultures, spirits are believed to be ______, watching over every home.", options: ["Symphony", "Omnipresent", "Scribble", "Phonetics"] },
            { word: "Omnibus", hint: "Root: OMNI- (All)", definition: "A vehicle carrying many passengers", sentence: "The crowded ______ rumbled through the city streets at dawn.", options: ["Inscribe", "Euphony", "Omnibus", "Conscription"] },
            { word: "Phonograph", hint: "Root: PHON- (Sound)", definition: "A record player", sentence: "My grandfather still listens to jazz on his vintage ______ from the 1940s.", options: ["Phonograph", "Omniscient", "Transcript", "Polyphony"] },
            { word: "Scribble", hint: "Root: SCRIB- (Write)", definition: "To write quickly without much detail", sentence: "I had to ______ a quick note on the napkin before I forgot the phone number.", options: ["Omnipresent", "Microphone", "Prescribe", "Scribble"] },
            { word: "Euphony", hint: "Root: PHON- (Sound)", definition: "Pleasing and harmonious sounds", sentence: "The ______ of the rainforest—birds chirping and water falling—was very relaxing.", options: ["Omnibus", "Euphony", "Inscribe", "Omnivore"] },
            { word: "Symphony", hint: "Root: PHON- (Sound)", definition: "A long, complex musical composition written for an orchestra", sentence: "The crowd sat in silence as the orchestra began the famous ______.", options: ["Symphony", "Phonograph", "Scribble", "Omniscient"] },
            { word: "Transcript", hint: "Root: SCRIB- (Write)", definition: "A written record", sentence: "The lawyer requested a ______ of the witness's testimony.", options: ["Phonetics", "Conscription", "Transcript", "Omnipresent"] },
            { word: "Polyphony", hint: "Root: PHON- (Sound)", definition: "Music arranged for many voices or instruments", sentence: "The choir's ______ created a beautiful, layered sound in the cathedral.", options: ["Polyphony", "Microphone", "Omnibus", "Euphony"] },
            { word: "Conscription", hint: "Root: SCRIB- (Write)", definition: "Required military service", sentence: "During the war, the government used ______ to increase the size of the army.", options: ["Symphony", "Prescribe", "Phonograph", "Conscription"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
