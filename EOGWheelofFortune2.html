        color: white;
        text-align: center;
    }

    h1 {
        margin: 10px 0 0;
        font-family: Impact, Arial Black, sans-serif;
        font-size: 54px;
        color: #ffd447;
        letter-spacing: 3px;
        text-shadow: 4px 4px 0 #06164d, 7px 7px 0 #9b6400, 0 0 20px #000;
    }

    .subtitle {
        margin-bottom: 18px;
        font-weight: bold;
        letter-spacing: 4px;
    }

        width: 92%;
        max-width: 1000px;
        min-height: 130px;
        margin: 0 auto 25px;
        padding: 18px;
        background: #06164d;
        border: 7px solid #ffd447;
        border-radius: 18px;
        box-shadow: inset 0 0 25px #000, 0 10px 25px rgba(0,0,0,0.55);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }

    .letter-slot {
        width: 50px;
        height: 62px;
        background: white;
        color: #06164d;
        border: 3px solid #082f7f;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Impact, Arial Black, sans-serif;
        font-size: 38px;
        box-shadow: 0 4px 0 #020617;
    }

    .letter-slot.hidden {
        background: #0ea66f;
        color: transparent;
    }

    .letter-slot.space {
        width: 25px;
        background: transparent;
        border: none;
        box-shadow: none;
    }

    .game-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 35px;
        width: 100%;
    }

    }
