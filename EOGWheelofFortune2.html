<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELA EOG Wheel of Fortune</title>
    <style>
        :root {
            --navy: #06164d;
            --blue: #0b4ed1;
            --light-blue: #3f8cff;
            --gold: #ffd447;
            --dark-gold: #9b6400;
            --white: #ffffff;
            --black: #111111;
            --tile-green: #0ea66f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 15px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: linear-gradient(#135be8, #06164d 55%, #020617);
        }

        .stage {
            max-width: 1150px;
            margin: 0 auto;
        }

        h1 {
            margin: 5px 0 0;
            text-align: center;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 4rem;
            letter-spacing: 3px;
            color: var(--gold);
            text-shadow: 4px 4px 0 var(--navy), 7px 7px 0 var(--dark-gold), 0 0 25px #000;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }

        #puzzle-display {
            width: 100%;
            min-height: 145px;
            margin: 0 auto 25px;
            padding: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            border: 7px solid var(--gold);
            border-radius: 18px;
            background: #06164d;
            box-shadow: inset 0 0 25px #000, 0 10px 25px rgba(0,0,0,0.55);
        }

        .letter-slot {
            width: 52px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #082f7f;
            border-radius: 5px;
            background: linear-gradient(#ffffff, #d9f7ff);
            color: var(--navy);
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 2.4rem;
            box-shadow: inset 0 -5px 7px rgba(0,0,0,0.15), 0 4px 0 #020617;
        }

        .letter-slot.hidden {
            color: transparent;
            background: linear-gradient(#1cd493, #087a55);
        }

        .letter-slot.space {
            width: 28px;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .main-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        #wheel-container {
            position: relative;
            width: 390px;
            height: 390px;
            max-width: 88vw;
            max-height: 88vw;
            border-radius: 50%;
            border: 9px solid var(--gold);
            background: var(--navy);
            box-shadow: 0 0 30px rgba(255,212,71,0.7), 0 15px 35px rgba(0,0,0,0.65);
        }

        #wheel {
            position: absolute;
            left: 12px;
            top: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 6px solid white;
            transition: transform 3s cubic-bezier(0.1, 0.7, 0.2, 1);
            background: conic-gradient(
                #e53935 0deg 45deg,
                #1e88e5 45deg 90deg,
                #fdd835 90deg 135deg,
                #43a047 135deg 180deg,
                #fb8c00 180deg
