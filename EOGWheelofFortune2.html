<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELA EOG Wheel of Fortune</title>
    <style>
        :root {
            --blue: #063a9b;
            --dark-blue: #06164d;
            --gold: #ffcc00;
            --white: #ffffff;
            --black: #1a1a1a;
            --green: #00703c;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to bottom, #1f66d8, #06164d 60%, #020617);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1 {
            font-family: Impact, 'Arial Black', sans-serif;
            text-shadow: 4px 4px #06164d, 7px 7px #8a5a00;
            color: var(--gold);
            font-size: 3.5rem;
            letter-spacing: 3px;
            margin: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        #category-display {
            background: var(--gold);
            color: var(--dark-blue);
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.45rem;
            letter-spacing: 2px;
            text-align: center;
            padding: 10px 25px;
            margin: 0 0 15px;
            border-radius: 12px;
            border: 4px solid white;
            box-shadow: 0 5px 14px rgba(0,0,0,0.45);
            text-transform: uppercase;
            max-width: 90%;
        }

        #puzzle-display {
            background-color: #06164d;
            padding: 20px;
            border: 8px solid var(--gold);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 90%;
            min-height: 115px;
            margin-bottom: 20px;
            border-radius: 18px;
            box-shadow: inset 0 0 25px #000, 0 10px 25px rgba(0,0,0,0.5);
        }

        .letter-slot {
            width: 42px;
            height: 54px;
            background: linear-gradient(to bottom, #ffffff, #dff6ff);
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 2rem;
            border-radius: 5px;
            border: 3px solid #082f7f;
            box-shadow: 0 4px 0 #020617;
        }

        .letter-slot.hidden {
            background: linear-gradient(to bottom, #19c68b, #087a55);
            color: transparent;
        }

        .letter-slot.space {
            background-color: transparent;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            width: 100%;
            align-items: center;
        }

        #wheel-container {
            position: relative;
            width: 330px;
            height: 330px;
            border: 8px solid var(--gold);
            border-radius: 50%;
            background: #06164d;
            box-shadow: 0 0 28px rgba(255,204,0,0.75), 0 12px 28px rgba(0,0,0,0.6);
        }

        #wheel {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 5px solid #fff;
            transition: transform 3s cubic-bezier(0.1, 0, 0.2, 1);
            background: conic-gradient(
                #f44336 0deg 60deg, 
                #2196f3 60deg 120deg, 
                #ffeb3b 120deg 180deg, 
                #4caf50 180deg 240deg, 
                #ff9800 240deg 300deg, 
                #9c27b0 300deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 38px solid var(--gold);
            z-index: 10;
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #06164d;
            background: var(--gold);
            border: 5px solid white;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 0.95rem;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .controls {
            text-align: center;
            background: #0b2d8a;
            border: 5px solid var(--gold);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.55);
            max-width: 430px;
        }

        .spin-result {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.6rem;
            line-height: 1.2;
            margin: 10px;
            padding: 12px;
            color: var(--gold);
            min-height: 60px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            text-shadow: 2px 2px #000;
        }

        button {
            padding: 11px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 999px;
            border: none;
            background: var(--gold);
            color: #06164d;
            margin: 5px;
            box-shadow: 0 5px 0 #7a4f00;
            text-transform: uppercase;
        }

        button:hover {
            filter: brightness(1.08);
        }

        #letter-input {
            padding: 10px;
            width: 55px;
            font-size: 1.2rem;
            text-align: center;
            border: 3px solid #a7c9ff;
            border-radius: 8px;
        }

        .scoreboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            background: rgba(0,0,0,0.45);
            padding: 15px;
            border-radius: 14px;
            border: 3px solid rgba(255,204,0,0.6);
        }

        .team-score {
            text-align: center;
            border-right: 1px solid #777;
            padding-right: 20px;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .team-score span {
            color: var(--gold);
            font-size: 1.6rem;
            text-shadow: 2px 2px #000;
        }

        .team-score:last-child { border: none; }

        .game-note {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #dbeafe;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            h1 { font-size: 2.4rem; }
            #category-display { font-size: 1.15rem; }
            #wheel-container { width: 300px; height: 300px; }
            #wheel { width: 270px; height: 270px; }
            .letter-slot { width: 34px; height: 45px; font-size: 1.55rem; }
        }
    </style>
</head>
<body>

<h1>EOG Wheel of Fortune</h1>

<div id="category-display">CATEGORY</div>
<div id="puzzle-display"></div>

<div class="game-container">
    <div id="wheel-container">
        <div id="pointer"></div>
        <div id="wheel"></div>
        <div class="center-text">SPIN<br>ME</div>
    </div>

    <div class="controls">
        <div class="spin-result" id="status">Spin the wheel to start!</div>
        <button onclick="spinWheel()">SPIN WHEEL</button>
        <br><br>
        <input type="text" id="letter-input" maxlength="1" placeholder="?">
        <button onclick="guessLetter()">GUESS LETTER</button>
        <button onclick="nextPuzzle()" style="background: #244aa8; color: white; box-shadow: 0 5px 0 #041142;">NEXT PUZZLE</button>
        <div class="game-note">Suggested pacing: 8-12 puzzles usually fills about 30 minutes.</div>
    </div>
</div>

<div class="scoreboard">
    <div class="team-score">Team 1: <span id="t1">0</span></div>
    <div class="team-score">Team 2: <span id="t2">0</span></div>
    <div class="team-score">Team 3: <span id="t3">0</span></div>
</div>

<script>
    const puzzles = [
        { category: "ACADEMIC VOCABULARY", answer: "CONVEY" },
        { category: "ACADEMIC VOCABULARY", answer: "ANALYZE" },
        { category: "ACADEMIC VOCABULARY", answer: "DETERMINE" },
        { category: "ACADEMIC VOCABULARY", answer: "EVALUATE" },
        { category: "ACADEMIC VOCABULARY", answer: "INFER" },
        { category: "ACADEMIC VOCABULARY", answer: "CITE EVIDENCE" },
        { category: "ACADEMIC VOCABULARY", answer: "SUPPORT" },
        { category: "ACADEMIC VOCABULARY", answer: "EXPLAIN" },
        { category: "ACADEMIC VOCABULARY", answer: "SUMMARIZE" },
        { category: "ACADEMIC VOCABULARY", answer: "COMPARE" },
        { category: "ACADEMIC VOCABULARY", answer: "CONTRAST" },
        { category: "ACADEMIC VOCABULARY", answer: "INTERPRET" },

        { category: "READING SKILL", answer: "CENTRAL IDEA" },
        { category: "READING SKILL", answer: "CONTEXT CLUES" },
        { category: "READING SKILL", answer: "AUTHOR PURPOSE" },
        { category: "READING SKILL", answer: "POINT OF VIEW" },
        { category: "READING SKILL", answer: "TEXT EVIDENCE" },
        { category: "READING SKILL", answer: "MAIN IDEA" },
        { category: "READING SKILL", answer: "SUPPORTING DETAILS" },
        { category: "READING SKILL", answer: "THEME" },

        { category: "LITERARY DEVICE", answer: "PERSONIFICATION" },
        { category: "LITERARY DEVICE", answer: "METAPHOR" },
        { category: "LITERARY DEVICE", answer: "HYPERBOLE" },
        { category: "LITERARY DEVICE", answer: "ALLITERATION" },
        { category: "LITERARY DEVICE", answer: "SENSORY IMAGERY" },
        { category: "LITERARY DEVICE", answer: "TONE" },
        { category: "LITERARY DEVICE", answer: "MOOD" },

        { category: "TEXT STRUCTURE", answer: "CAUSE AND EFFECT" },
        { category: "TEXT STRUCTURE", answer: "PROBLEM AND SOLUTION" },
        { category: "TEXT STRUCTURE", answer: "COMPARE AND CONTRAST" },
        { category: "TEXT STRUCTURE", answer: "SEQUENCE OF EVENTS" },
        { category: "TEXT STRUCTURE", answer: "DESCRIPTION" },

        { category: "WORD STUDY", answer: "HOMOPHONES" },
        { category: "WORD STUDY", answer: "PREFIX" },
        { category: "WORD STUDY", answer: "SUFFIX" },
        { category: "WORD STUDY", answer: "ROOT WORD" }
    ];

    const values = [100, 200, 500, "BANKRUPT", 300, 1000];
    let currentPuzzle = "";
    let currentCategory = "";
    let guessedLetters = [];
    let usedPuzzleIndexes = [];
    let currentSpinValue = 0;
    let rotation = 0;

    function initGame() {
        nextPuzzle();
    }

    function nextPuzzle() {
        if (usedPuzzleIndexes.length === puzzles.length) {
            usedPuzzleIndexes = [];
        }

        let randomIndex = Math.floor(Math.random() * puzzles.length);
        while (usedPuzzleIndexes.includes(randomIndex)) {
            randomIndex = Math.floor(Math.random() * puzzles.length);
        }

        usedPuzzleIndexes.push(randomIndex);
        currentPuzzle = puzzles[randomIndex].answer;
        currentCategory = puzzles[randomIndex].category;
        guessedLetters = [];
        currentSpinValue = 0;

        document.getElementById('category-display').innerText = "CATEGORY: " + currentCategory;
        displayPuzzle();
        document.getElementById('status').innerText = "New Puzzle! Spin for points.";
    }

    function displayPuzzle() {
        const container = document.getElementById('puzzle-display');
        container.innerHTML = "";
        
        [...currentPuzzle].forEach(char => {
            const slot = document.createElement('div');
            if (char === " ") {
                slot.className = "letter-slot space";
            } else {
                slot.className = "letter-slot " + (guessedLetters.includes(char) ? "" : "hidden");
                slot.innerText = char;
            }
            container.appendChild(slot);
        });
    }

    function spinWheel() {
        const spinAmount = Math.floor(Math.random() * 360) + 720;
        rotation += spinAmount;
        document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
        
        setTimeout(() => {
            const actualDeg = rotation % 360;
            const index = Math.floor((360 - actualDeg) / 60) % 6;
            currentSpinValue = values[index];
            
            if (currentSpinValue === "BANKRUPT") {
                document.getElementById('status').innerText = "OH NO! BANKRUPT!";
            } else {
                document.getElementById('status').innerText = `You spun for ${currentSpinValue} points! Guess a letter.`;
            }
        }, 3000);
    }

    function guessLetter() {
        const input = document.getElementById('letter-input');
        const letter = input.value.toUpperCase();
        input.value = "";

        if (!letter || currentSpinValue === "BANKRUPT") return;

        if (guessedLetters.includes(letter)) {
            document.getElementById('status').innerText = letter + " has already been guessed. Try another letter.";
            return;
        }

        if (currentPuzzle.includes(letter)) {
            guessedLetters.push(letter);
            const count = (currentPuzzle.match(new RegExp(letter, "g")) || []).length;
            document.getElementById('status').innerText = `Yes! There are ${count} ${letter}'s. Spin again!`;
            displayPuzzle();
            checkWin();
        } else {
            guessedLetters.push(letter);
            document.getElementById('status').innerText = "Sorry, no " + letter + ". Next team's turn!";
        }
    }

    function checkWin() {
        const isWon = [...currentPuzzle.replace(/\s/g, "")].every(char => guessedLetters.includes(char));
        if (isWon) {
            document.getElementById('status').innerText = "PUZZLE SOLVED! Excellent work! Click Next Puzzle to continue.";
        }
    }

    initGame();
</script>

</body>
</html>
