<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELA EOG Wheel of Fortune</title>
    <style>
        :root {
            --blue-dark: #071d5f;
            --blue-mid: #123fa3;
            --blue-light: #2c78ff;
            --gold: #ffd447;
            --gold-dark: #b87900;
            --white: #ffffff;
            --black: #111111;
            --tile-green: #15b87a;
            --tile-border: #062b62;
            --red: #e53935;
            --orange: #fb8c00;
            --yellow: #fdd835;
            --green: #43a047;
            --purple: #8e24aa;
            --pink: #d81b60;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 18px;
            font-family: Impact, 'Arial Black', system-ui, sans-serif;
            color: var(--white);
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.22), transparent 22%),
                radial-gradient(circle at 20% 20%, rgba(255,212,71,0.25), transparent 18%),
                linear-gradient(180deg, #0d4ac9 0%, #071d5f 48%, #03071f 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.75) 0 2px, transparent 3px),
                radial-gradient(circle, rgba(255,212,71,0.65) 0 2px, transparent 3px);
            background-size: 90px 90px, 130px 130px;
            background-position: 10px 20px, 60px 45px;
            opacity: 0.25;
        }

        .stage {
            width: min(1180px, 100%);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 auto 14px;
            text-align: center;
            font-size: clamp(2.3rem, 7vw, 5rem);
            letter-spacing: 3px;
            line-height: 0.95;
            color: var(--gold);
            text-shadow:
                0 3px 0 var(--gold-dark),
                0 7px 0 #06164d,
                0 12px 22px rgba(0,0,0,0.75);
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            margin: -4px 0 20px;
            font-family: Arial, sans-serif;
            font-weight: 800;
            letter-spacing: 4px;
            color: #eaf4ff;
            text-shadow: 0 2px 5px #000;
        }

        #puzzle-display {
            width: min(1040px, 100%);
            min-height: 150px;
            margin: 0 auto 26px;
            padding: clamp(14px, 2vw, 24px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            border-radius: 22px;
            border: 8px solid #0a2d82;
            background:
                linear-gradient(180deg, #07256f, #041747),
                repeating-linear-gradient(90deg, transparent 0 20px, rgba(255,255,255,0.04) 20px 22px);
            box-shadow:
                inset 0 0 22px rgba(0,0,0,0.8),
                0 0 0 5px var(--gold),
                0 12px 35px rgba(0,0,0,0.55);
        }

        .letter-slot {
            width: clamp(34px, 6vw, 58px);
            height: clamp(45px, 7vw, 68px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            border: 3px solid var(--tile-border);
            font-size: clamp(1.7rem, 4vw, 3rem);
            color: #06164d;
            background:
                linear-gradient(145deg, #ffffff 0%, #d7f7ff 45%, #ffffff 100%);
            box-shadow:
                inset 0 4px 6px rgba(255,255,255,0.8),
                inset 0 -5px 8px rgba(0,0,0,0.18),
                0 4px 0 #03133d;
            text-transform: uppercase;
        }

        .letter-slot.hidden {
            color: transparent;
            background:
                linear-gradient(145deg, #13c98a 0%, #07895f 100%);
        }

        .letter-slot.space {
            width: clamp(18px, 3vw, 34px);
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .main-area {
            display: grid;
            grid-template-columns: minmax(290px, 430px) minmax(290px, 470px);
            gap: 28px;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 850px) {
            .main-area { grid-template-columns: 1fr; }
        }

        .wheel-showcase {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #wheel-container {
            position: relative;
            width: min(430px, 88vw);
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 12px;
            background: radial-gradient(circle, #fff 0 4%, var(--gold) 5% 8%, #05154d 9% 100%);
            box-shadow:
                0 0 0 7px var(--gold),
                0 0 34px rgba(255,212,71,0.7),
                0 16px 40px rgba(0,0,0,0.65);
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 7px solid #f7f7f7;
            transition: transform 3.2s cubic-bezier(0.11, 0.67, 0.18, 1);
            background: conic-gradient(
                var(--red) 0deg 45deg,
                var(--blue-light) 45deg 90deg,
                var(--yellow) 90deg 135deg,
                var(--green) 135deg 180deg,
                var(--orange) 180deg 225deg,
                var(--purple) 225deg 270deg,
                var(--pink) 270deg 315deg,
                #00acc1 315deg 360deg
            );
        }

        #wheel::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0 8%, transparent 9% 100%);
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 47%;
            text-align: right;
            transform-origin: left center;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: clamp(0.78rem, 2.7vw, 1.25rem);
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            padding-right: 11px;
            letter-spacing: 1px;
        }

        .wheel-label:nth-child(1) {
