
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 4 Vocabulary Quiz</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    
    <!-- Back Link to Home Page -->
    <div class="w-full max-w-5xl">
        <a href="index.html" class="text-slate-500 hover:text-blue-600 font-bold text-lg mb-4 inline-block transition-colors">
            ← HUB_CENTRAL
        </a>
    </div>

    <!-- The quiz loads inside this root div -->
    <div id="root" class="w-full max-w-5xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const quizData = [
            { word: "Graphology", hint: "Root: GRAPH (Write)", definition: "The study of written or printed symbols and of handwriting", sentence: "The detective used ______ to see if the ransom note matched the suspect's writing.", options: ["Flexible", "Graphology", "Prologue", "Telegraph"] },
            { word: "Flexible", hint: "Root: FLEX (Bend)", definition: "Capable of bending easily without breaking", sentence: "The gymnast was incredibly ______, allowing her to perform amazing stunts.", options: ["Logic", "Vacuum", "Flexible", "Evacuate"] },
            { word: "Vacant", hint: "Root: VAC (Empty)", definition: "An area not filled with anything; empty", sentence: "We found a ______ lot in the city where we could build a community garden.", options: ["Vacant", "Biodiversity", "Phonograph", "Neologism"] },
            { word: "Biodiversity", hint: "Root: BIO (Life)", definition: "The existence of many different kinds of plants and animals in an environment", sentence: "The rainforest is known for its incredible ______, hosting thousands of species.", options: ["Reflex", "Biodiversity", "Chronometer", "Flexuous"] },
            { word: "Reflex", hint: "Root: FLEX (Bend)", definition: "A response in a part of the body to stimulation of a specific point", sentence: "The doctor tapped my knee to check my ______.", options: ["Antibiotic", "Vacant", "Logic", "Reflex"] },
            { word: "Neologism", hint: "Root: LOG (Word/Reason)", definition: "The coining or use of new words", sentence: "The rise of the internet led to the creation of many a ______ like 'blog' and 'wi-fi'.", options: ["Graphology", "Chronometer", "Neologism", "Vacuum"] },
            { word: "Chronometer", hint: "Root: CHRONO (Time)", definition: "An instrument used for measuring time", sentence: "Sailors used a ______ to determine their longitude while at sea.", options: ["Chronometer", "Prologue", "Flexuous", "Telegraph"] },
            { word: "Phonograph", hint: "Root: GRAPH (Write)", definition: "A record player", sentence: "My great-grandfather used to listen to music on an old ______.", options: ["Flexible", "Evacuate", "Phonograph", "Reflex"] },
            { word: "Vacuum", hint: "Root: VAC (Empty)", definition: "A space entirely devoid of matter", sentence: "Sound cannot travel through a ______ because there are no particles to carry it.", options: ["Logic", "Vacuum", "Vacant", "Biodiversity"] },
            { word: "Flexuous", hint: "Root: FLEX (Bend)", definition: "Full of bends and curves", sentence: "The ______ mountain road was difficult to navigate in the dark.", options: ["Antibiotic", "Graphology", "Flexuous", "Phonograph"] },
            { word: "Prologue", hint: "Root: LOG (Word/Reason)", definition: "A separate introductory section of a literary or musical work", sentence: "The ______ of the book provided important background information about the war.", options: ["Prologue", "Neologism", "Evacuate", "Telegraph"] },
            { word: "Antibiotic", hint: "Root: BIO (Life)", definition: "A medicine that inhibits or destroys the growth of microorganisms", sentence: "The doctor prescribed an ______ to clear up the infection.", options: ["Reflex", "Antibiotic", "Chronometer", "Flexible"] },
            { word: "Evacuate", hint: "Root: VAC (Empty)", definition: "To remove someone from a place of danger to somewhere safer", sentence: "The town had to ______ its residents before the hurricane made landfall.", options: ["Vacant", "Vacuum", "Logic", "Evacuate"] },
            { word: "Telegraph", hint: "Root: GRAPH (Write)", definition: "A system of transmitting messages across a distance with a wire", sentence: "Before the telephone, the ______ was the primary way to send long-distance messages.", options: ["Telegraph", "Graphology", "Phonograph", "Flexuous"] },
            { word: "Logic", hint: "Root: LOG (Word/Reason)", definition: "A reasonable way of thinking about or understanding something", sentence: "You need to use ______ to solve this complex math puzzle.", options: ["Prologue", "Neologism", "Logic", "Biodiversity"] }
        ];

        function Quiz() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [score, setScore] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [quizComplete, setQuizComplete] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleAnswer = (selectedOption) => {
                const isCorrect = selectedOption === quizData[currentQuestion].word;
                
                if (isCorrect) {
                    setFeedback('correct');
                    setScore(score + 1);
                } else {
                    setFeedback('incorrect');
                }

                setTimeout(() => {
                    setFeedback(null);
                    setShowHint(false);
                    if (currentQuestion + 1 < quizData.length) {
                        setCurrentQuestion(currentQuestion + 1);
                    } else {
                        setQuizComplete(true);
                    }
                }, 1000);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setScore(0);
                setShowHint(false);
                setQuizComplete(false);
                setFeedback(null);
            };

            if (quizComplete) {
                return (
                    <div className="bg-white p-8 rounded-xl shadow-lg text-center max-w-md mx-auto mt-8">
                        <h2 className="text-3xl font-bold mb-4 text-slate-800">Quiz Complete!</h2>
                        <p className="text-xl mb-6">You scored <span className="font-bold text-blue-600">{score}</span> out of {quizData.length}</p>
                        <button 
                            onClick={resetQuiz}
                            className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                        >
                            Try Again
                        </button>
                    </div>
                );
            }

            const q = quizData[currentQuestion];
            const progress = ((currentQuestion) / quizData.length) * 100;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col w-full h-[600px]">
                    <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                        <div className="font-semibold text-lg flex-1">Score: {score} / {quizData.length}</div>
                        <div className="flex-1 max-w-md bg-slate-600 rounded-full h-3 mx-4">
                            <div className="bg-blue-400 h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                        </div>
                        <div className="font-semibold text-lg flex-1 text-right">Question {currentQuestion + 1} of {quizData.length}</div>
                    </div>

                    <div className="flex-1 flex flex-col md:flex-row">
                        <div className="md:w-1/2 p-8 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col justify-center bg-slate-50">
                            <div className="mb-6">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Definition</span>
                                <p className="text-xl font-medium text-slate-800 mt-1 italic">"{q.definition}"</p>
                            </div>
                            
                            <div className="mb-8">
                                <span className="text-sm font-bold uppercase tracking-wider text-slate-500">Sentence</span>
                                <p className="text-2xl font-bold text-blue-900 mt-2 leading-snug">{q.sentence}</p>
                            </div>

                            <div>
                                {!showHint ? (
                                    <button 
                                        onClick={() => setShowHint(true)}
                                        className="text-sm bg-amber-100 text-amber-800 px-4 py-2 rounded-full font-semibold hover:bg-amber-200 transition"
                                    >
                                        💡 Need a Hint?
                                    </button>
                                ) : (
                                    <div className="inline-block bg-amber-200 text-amber-900 px-4 py-2 rounded-full font-bold animate-pulse">
                                        {q.hint}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="md:w-1/2 p-8 flex flex-col justify-center gap-4 bg-white">
                            <h3 className="text-lg font-semibold text-slate-700 mb-2 text-center">Select the correct word:</h3>
                            {q.options.map((option, index) => {
                                let btnClass = "w-full text-left text-lg p-5 rounded-lg border-2 font-medium transition duration-200 shadow-sm ";
                                
                                if (feedback && option === q.word) {
                                    btnClass += "bg-green-100 border-green-500 text-green-800";
                                } else if (feedback === 'incorrect' && option !== q.word) {
                                    btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                    btnClass += "bg-white border-slate-300 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                                }

                                return (
                                    <button 
                                        key={index}
                                        disabled={feedback !== null}
                                        onClick={() => handleAnswer(option)}
                                        className={btnClass}
                                    >
                                        {option}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
