<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELA EOG Wheel of Fortune</title>
    <style>
        :root {
            --green: #00703c;
            --gold: #ffcc00;
            --white: #ffffff;
            --black: #1a1a1a;
        }

        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            background-color: var(--green);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            text-shadow: 3px 3px var(--black);
            font-size: 2.5rem;
            margin: 10px;
        }

        /* The Puzzle Board */
        #puzzle-display {
            background-color: #222;
            padding: 20px;
            border: 10px solid #444;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 90%;
            min-height: 100px;
            margin-bottom: 20px;
        }

        .letter-slot {
            width: 40px;
            height: 50px;
            background-color: var(--white);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 4px;
        }

        .letter-slot.hidden {
            background-color: #333;
            color: transparent;
        }

        .letter-slot.space {
            background-color: transparent;
            border: none;
        }

        /* The Wheel Area */
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            width: 100%;
            align-items: center;
        }

        #wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            transition: transform 3s cubic-bezier(0.1, 0, 0.2, 1);
            background: conic-gradient(
                #f44336 0deg 60deg, 
                #2196f3 60deg 120deg, 
                #ffeb3b 120deg 180deg, 
                #4caf50 180deg 240deg, 
                #ff9800 240deg 300deg, 
                #9c27b0 300deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 10;
        }

        /* Controls */
        .controls {
            text-align: center;
        }

        .spin-result {
            font-size: 1.5rem;
            margin: 10px;
            color: var(--gold);
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: var(--gold);
            margin: 5px;
        }

        #letter-input {
            padding: 10px;
            width: 50px;
            font-size: 1.2rem;
            text-align: center;
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
        }

        .team-score {
            text-align: center;
            border-right: 1px solid #777;
            padding-right: 20px;
        }

        .team-score:last-child { border: none; }
    </style>
</head>
<body>

<h1>EOG Wheel of Fortune</h1>

<div id="puzzle-display"></div>

<div class="game-container">
    <div id="wheel-container">
        <div id="pointer"></div>
        <div id="wheel"></div>
        <div style="position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:white; font-size: 0.8rem; text-align: center;">SPIN ME</div>
    </div>

    <div class="controls">
        <div class="spin-result" id="status">Spin the wheel to start!</div>
        <button onclick="spinWheel()">SPIN WHEEL</button>
        <br><br>
        <input type="text" id="letter-input" maxlength="1" placeholder="?">
        <button onclick="guessLetter()">GUESS LETTER</button>
        <button onclick="nextPuzzle()" style="background: #555; color: white;">NEXT PUZZLE</button>
    </div>
</div>

<div class="scoreboard">
    <div class="team-score">Team 1: <span id="t1">0</span></div>
    <div class="team-score">Team 2: <span id="t2">0</span></div>
    <div class="team-score">Team 3: <span id="t3">0</span></div>
</div>

<script>
    const puzzles = [
        "PERSONIFICATION", "METAPHOR", "HYPERBOLE", "ALLITERATION", 
        "TEXT STRUCTURE", "CONTEXT CLUES", "AUTHOR PURPOSE", "SENSORY IMAGERY",
        "INFERENCE", "CENTRAL IDEA", "CAUSE AND EFFECT", "HOMOPHONES"
    ];

    const values = [100, 200, 500, "BANKRUPT", 300, 1000];
    let currentPuzzle = "";
    let guessedLetters = [];
    let currentSpinValue = 0;
    let rotation = 0;

    function initGame() {
        nextPuzzle();
    }

    function nextPuzzle() {
        const randomIndex = Math.floor(Math.random() * puzzles.length);
        currentPuzzle = puzzles[randomIndex];
        guessedLetters = [];
        displayPuzzle();
        document.getElementById('status').innerText = "New Puzzle! Spin for points.";
    }

    function displayPuzzle() {
        const container = document.getElementById('puzzle-display');
        container.innerHTML = "";
        
        [...currentPuzzle].forEach(char => {
            const slot = document.createElement('div');
            if (char === " ") {
                slot.className = "letter-slot space";
            } else {
                slot.className = "letter-slot " + (guessedLetters.includes(char) ? "" : "hidden");
                slot.innerText = char;
            }
            container.appendChild(slot);
        });
    }

    function spinWheel() {
        const spinAmount = Math.floor(Math.random() * 360) + 720; // At least 2 full spins
        rotation += spinAmount;
        document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
        
        setTimeout(() => {
            const actualDeg = rotation % 360;
            const index = Math.floor((360 - actualDeg) / 60) % 6;
            currentSpinValue = values[index];
            
            if (currentSpinValue === "BANKRUPT") {
                document.getElementById('status').innerText = "OH NO! BANKRUPT!";
            } else {
                document.getElementById('status').innerText = `You spun for ${currentSpinValue} points! Guess a letter.`;
            }
        }, 3000);
    }

    function guessLetter() {
        const input = document.getElementById('letter-input');
        const letter = input.value.toUpperCase();
        input.value = "";

        if (!letter || currentSpinValue === "BANKRUPT") return;

        if (currentPuzzle.includes(letter)) {
            if (!guessedLetters.includes(letter)) {
                guessedLetters.push(letter);
                const count = (currentPuzzle.match(new RegExp(letter, "g")) || []).length;
                document.getElementById('status').innerText = `Yes! There are ${count} ${letter}'s. Spin again!`;
                displayPuzzle();
                checkWin();
            }
        } else {
            document.getElementById('status').innerText = "Sorry, no " + letter + ". Next team's turn!";
        }
    }

    function checkWin() {
        const isWon = [...currentPuzzle.replace(/\s/g, "")].every(char => guessedLetters.includes(char));
        if (isWon) {
            document.getElementById('status').innerText = "PUZZLE SOLVED! Excellent work!";
        }
    }

    initGame();
</script>

</body>
</html>
