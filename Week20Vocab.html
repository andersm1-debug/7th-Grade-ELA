<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEEK 20: SUFFIX PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0b0f19;
            background-image: linear-gradient(rgba(255, 183, 3, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 183, 3, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #c9d1d9;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #lab-container {
            background: rgba(11, 15, 25, 0.95);
            border: 2px solid #212d40;
            border-top: 8px solid #ffb703;
            padding: 30px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .hub-link {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .hub-link:hover { color: #ffb703; }

        .lab-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-align: center;
            margin: 20px 0 5px 0;
            color: #ffb703;
            letter-spacing: 2px;
        }
        
        .sub-title {
            text-align: center;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Live Word Bank - Defaults to hidden until a Cloze question appears */
        #word-bank {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: #111827;
            border: 1px solid #374151;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .bank-word {
            background: #1f2937;
            color: #ffb703;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.9rem;
            border: 1px solid #374151;
            transition: 0.3s;
        }

        .bank-word.used {
            text-decoration: line-through;
            color: #4b5563;
            border-color: #1f2937;
            background: transparent;
        }

        #format-label {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            color: #ffb703;
            font-size: 1rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .question-box {
            background: transparent;
            padding: 10px 20px 20px 20px;
            margin-bottom: 20px;
            color: #e5e7eb;
            font-size: 1.4rem;
            line-height: 1.8;
            text-align: center;
        }

        .highlight { color: #ffb703; font-weight: bold; }
        .highlight-blank {
            display: inline-block;
            width: 150px;
            border-bottom: 2px dashed #ffb703;
            margin: 0 10px;
            color: #ffb703;
        }

        /* Multiple Choice Options */
        #mcq-options {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 18px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: #ffb703;
            color: #0b0f19;
            border-color: #ffb703;
            transform: translateX(5px);
        }

        /* Terminal Input Area */
        #cloze-input-area {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        #cloze-input {
            background: #0b0f19;
            border: 1px solid #ffb703;
            color: #ffb703;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            border-radius: 4px;
            width: 50%;
            text-align: center;
            text-transform: uppercase;
        }

        #cloze-input:focus { outline: none; box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }

        #submit-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        #submit-btn:hover { filter: brightness(1.2); }

        /* Feedback Modal */
        #feedback-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .next-btn {
            background: #ffb703;
            color: #0b0f19;
            border: none;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            border-radius: 4px;
            font-weight: bold;
        }

        #progress-bar { width: 100%; height: 6px; background: #1f2937; margin-bottom: 20px; border-radius: 3px; }
        #progress-fill { height: 100%; background: #ffb703; width: 0%; transition: width 0.3s; }

    </style>
</head>
<body>

<div id="lab-container">
    <a href="index.html" class="hub-link">← Return to Hub</a>
    <h1 class="lab-title">SUFFIX PROTOCOL</h1>
    <p class="sub-title">WEEK 20: -LESS | -ESS | -ACY | -ISH</p>
    
    <div id="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="word-bank">
        </div>

    <div id="quiz-content">
        <div id="format-label">MODE: INITIALIZING...</div>
        <div id="text-display" class="question-box">LOADING DATA...</div>
        
        <div id="mcq-options"></div>

        <div id="cloze-input-area">
            <input type="text" id="cloze-input" placeholder="ENTER OVERRIDE CODE..." autocomplete="off">
            <button id="submit-btn" onclick="checkClozeAnswer()">SUBMIT</button>
        </div>
    </div>
</div>

<div id="feedback-modal">
    <h1 id="fb-status" style="font-family:'Orbitron'; font-size: 3rem;"></h1>
    <p id="fb-info" style="font-size: 1.2rem; max-width: 600px; color: #d1d5db; padding: 20px; line-height: 1.6;"></p>
    <button class="next-btn" onclick="nextQuestion()">CONTINUE</button>
</div>

<script>
    const allWords = [
        "Homeless", "Hopeless", "Fearless", "Legacy", 
        "Democracy", "Supremacy", "Lioness", "Selfish", 
        "Amateurish", "Childish", "Conspiracy", "Bureaucracy", "Fallacy"
    ];

    // 27 Multiple Choice Questions to cover all meanings, synonyms, and antonyms
    const rawMCQ = [
        { type: "mcq", text: "The suffix <b>-LESS</b> means 'without'. What does it mean if someone is <span class='highlight'>homeless</span>?", choices: [ { text: "Without a home.", correct: true }, { text: "Lacking professional skill.", correct: false }, { text: "Without fear.", correct: false } ], explanation: "Homeless literally means living without a home." },
        { type: "mcq", text: "Which of the following describes a <span class='highlight'>hopeless</span> situation?", choices: [ { text: "A desperate scenario providing no optimism or chance of success.", correct: true }, { text: "A secret plan by a group to do something unlawful.", correct: false }, { text: "The state of being the highest or greatest.", correct: false } ], explanation: "If a situation provides no hope, it is hopeless." },
        { type: "mcq", text: "What is the best definition of <span class='highlight'>fearless</span>?", choices: [ { text: "Without fear; extremely brave.", correct: true }, { text: "Caring only about yourself.", correct: false }, { text: "Immature and silly.", correct: false } ], explanation: "Fearless means acting without fear." },
        { type: "mcq", text: "The suffix <b>-ACY</b> means 'state or quality of'. What is a <span class='highlight'>legacy</span>?", choices: [ { text: "An inheritance or something handed down from an ancestor.", correct: true }, { text: "A female lion.", correct: false }, { text: "A mistaken belief.", correct: false } ], explanation: "A legacy is what is left behind or handed down from the past." },
        { type: "mcq", text: "A <span class='highlight'>democracy</span> is a political system where...", choices: [ { text: "Supreme power lies in a body of citizens who elect representatives.", correct: true }, { text: "A single monarch makes all decisions without voting.", correct: false }, { text: "There is endless paperwork and officials.", correct: false } ], explanation: "In a democracy, the people (citizens) hold the power to vote." },
        { type: "mcq", text: "What does <span class='highlight'>supremacy</span> mean?", choices: [ { text: "The state of being the highest or greatest in authority.", correct: true }, { text: "A false idea or argument.", correct: false }, { text: "A secret plot.", correct: false } ], explanation: "To have supremacy means to be supreme or holding the highest power." },
        { type: "mcq", text: "The suffix <b>-ESS</b> indicates a female. What is a <span class='highlight'>lioness</span>?", choices: [ { text: "A female lion.", correct: true }, { text: "A state of supreme power.", correct: false }, { text: "Someone lacking professional skill.", correct: false } ], explanation: "Adding -ess to lion creates lioness, meaning a female lion." },
        { type: "mcq", text: "The suffix <b>-ISH</b> means 'somewhat like or near'. If a person is <span class='highlight'>selfish</span>, they are...", choices: [ { text: "Caring only about themselves and not other people.", correct: true }, { text: "Without a home.", correct: false }, { text: "Without any hope.", correct: false } ], explanation: "Selfish people care 'somewhat like' only for their 'self'." },
        { type: "mcq", text: "What is an <span class='highlight'>amateurish</span> effort?", choices: [ { text: "A performance lacking professional skill or expertise.", correct: true }, { text: "A desperate, impossible mission.", correct: false }, { text: "A secret plan.", correct: false } ], explanation: "If it is amateurish, it is somewhat like an amateur (beginner)." },
        { type: "mcq", text: "To act in a <span class='highlight'>childish</span> way means to be...", choices: [ { text: "Immature and acting like a child.", correct: true }, { text: "Without fear.", correct: false }, { text: "Caring only about yourself.", correct: false } ], explanation: "Childish means somewhat like a child, usually meaning immature." },
        { type: "mcq", text: "What is a <span class='highlight'>conspiracy</span>?", choices: [ { text: "A secret plan by a group to do something unlawful or harmful.", correct: true }, { text: "A large organization of appointed officials.", correct: false }, { text: "An inheritance handed down.", correct: false } ], explanation: "A conspiracy is a plot designed in secret by multiple people." },
        { type: "mcq", text: "Which scenario best represents a <span class='highlight'>bureaucracy</span>?", choices: [ { text: "A massive organization with many appointed officials and strict rules.", correct: true }, { text: "A brave firefighter running into a building.", correct: false }, { text: "A mistaken belief about science.", correct: false } ], explanation: "A bureaucracy is a complex organization of officials." },
        { type: "mcq", text: "A <span class='highlight'>fallacy</span> is...", choices: [ { text: "A mistaken belief, especially one based on unsound argument.", correct: true }, { text: "A female lion hunting for prey.", correct: false }, { text: "A system of government where people vote.", correct: false } ], explanation: "A fallacy is a false or mistaken idea." },
        { type: "mcq", text: "If a hero is described as <span class='highlight'>fearless</span>, which word is an antonym (opposite)?", choices: [ { text: "Terrified.", correct: true }, { text: "Brave.", correct: false }, { text: "Childish.", correct: false } ], explanation: "Terrified is the opposite of being without fear (fearless)." },
        { type: "mcq", text: "If a leader tries to establish <span class='highlight'>supremacy</span>, what are they trying to do?", choices: [ { text: "Gain total dominance and the highest authority.", correct: true }, { text: "Share power equally with all citizens.", correct: false }, { text: "Hide a secret plan.", correct: false } ], explanation: "Supremacy means maintaining the highest position of power." },
        { type: "mcq", text: "In a <span class='highlight'>democracy</span>, who holds the supreme power?", choices: [ { text: "The citizens who vote and elect representatives.", correct: true }, { text: "Appointed officials in a bureaucracy.", correct: false }, { text: "A single king or queen.", correct: false } ], explanation: "Democracy is power held by the citizens." },
        { type: "mcq", text: "Which of the following is an example of a <span class='highlight'>legacy</span>?", choices: [ { text: "A grandfather passing down his family business to his grandchildren.", correct: true }, { text: "A teenager refusing to share his video games.", correct: false }, { text: "A player missing a final shot in a game.", correct: false } ], explanation: "A legacy is an inheritance or gift handed down to the next generation." },
        { type: "mcq", text: "If a painting is described as <span class='highlight'>amateurish</span>, the critic is saying...", choices: [ { text: "It looks like it was painted by an unskilled beginner.", correct: true }, { text: "It is a masterpiece of professional art.", correct: false }, { text: "It is a mistaken belief.", correct: false } ], explanation: "Amateurish implies a lack of professional expertise." },
        { type: "mcq", text: "Why might someone be accused of being <span class='highlight'>selfish</span>?", choices: [ { text: "They refuse to share their resources with others.", correct: true }, { text: "They bravely saved someone in danger.", correct: false }, { text: "They voted in an election.", correct: false } ], explanation: "Selfishness is caring only for yourself." },
        { type: "mcq", text: "Which of these is a famous <span class='highlight'>conspiracy</span> from history?", choices: [ { text: "A secret plot by Roman senators to assassinate Julius Caesar.", correct: true }, { text: "A scientist discovering a new element in a lab.", correct: false }, { text: "A city building a new park for the homeless.", correct: false } ], explanation: "A conspiracy involves a secret, harmful plan made by a group." },
        { type: "mcq", text: "If you are stuck in a <span class='highlight'>bureaucracy</span>, you are likely...", choices: [ { text: "Filling out dozens of forms and waiting for official approvals.", correct: true }, { text: "Acting immaturely.", correct: false }, { text: "Inheriting a large sum of money.", correct: false } ], explanation: "Bureaucracies are known for heavy paperwork and official rules." },
        { type: "mcq", text: "Believing that lightning never strikes the same place twice is an example of a...", choices: [ { text: "Fallacy.", correct: true }, { text: "Conspiracy.", correct: false }, { text: "Legacy.", correct: false } ], explanation: "It is a mistaken belief (fallacy) because lightning often strikes tall buildings multiple times." },
        { type: "mcq", text: "What behavior is most <span class='highlight'>childish</span>?", choices: [ { text: "Pouting and refusing to speak because you didn't win a game.", correct: true }, { text: "Filing paperwork with an appointed official.", correct: false }, { text: "Sharing your lunch with a friend.", correct: false } ], explanation: "Pouting is immature and 'somewhat like' a child." },
        { type: "mcq", text: "How is a <span class='highlight'>lioness</span> different from a male lion?", choices: [ { text: "She is the female of the species and does most of the hunting.", correct: true }, { text: "She is completely without fear.", correct: false }, { text: "She represents a political system.", correct: false } ], explanation: "The suffix -ess denotes the female animal." },
        { type: "mcq", text: "A student who feels <span class='highlight'>hopeless</span> about an upcoming test probably feels...", choices: [ { text: "Desperate and sure they are going to fail.", correct: true }, { text: "Confident and fully prepared.", correct: false }, { text: "Like an unskilled amateur.", correct: false } ], explanation: "Hopeless means lacking any optimism." },
        { type: "mcq", text: "What might a city do to help its <span class='highlight'>homeless</span> population?", choices: [ { text: "Build shelters and provide affordable housing options.", correct: true }, { text: "Create a secret conspiracy.", correct: false }, { text: "Establish naval supremacy.", correct: false } ], explanation: "Homeless people need assistance with housing." },
        { type: "mcq", text: "If a rumor is based on a <span class='highlight'>fallacy</span>, it is based on...", choices: [ { text: "A false idea or mistaken belief.", correct: true }, { text: "A verified scientific fact.", correct: false }, { text: "A professional performance.", correct: false } ], explanation: "A fallacy is an unsound argument or belief." }
    ];

    // 13 Cloze Questions (Exactly one for every word in the Word Bank)
    const rawCloze = [
        { type: "cloze", word: "Homeless", sentence: "After losing his job and apartment, the man unfortunately found himself <span class='highlight-blank'></span> and living on the streets.", explanation: "The suffix -less means without. He was without a home." },
        { type: "cloze", word: "Hopeless", sentence: "The situation seemed completely <span class='highlight-blank'></span>; they were down by 50 points with only two minutes left in the game.", explanation: "Because there was no optimism or chance of winning, it was HOPELESS." },
        { type: "cloze", word: "Fearless", sentence: "The <span class='highlight-blank'></span> firefighter rushed into the burning building to save the trapped puppy without a second thought.", explanation: "Acting without fear makes someone FEARLESS." },
        { type: "cloze", word: "Legacy", sentence: "The billionaire left a massive <span class='highlight-blank'></span> of charities and libraries for the city after she passed away.", explanation: "An inheritance or gift handed down to the future is a LEGACY." },
        { type: "cloze", word: "Democracy", sentence: "In a <span class='highlight-blank'></span>, the citizens have the power to elect their leaders by voting in free elections.", explanation: "A system where supreme power lies with the voting citizens is a DEMOCRACY." },
        { type: "cloze", word: "Supremacy", sentence: "The ancient empire fought hard to maintain its naval <span class='highlight-blank'></span> over the ocean trade routes.", explanation: "The state of being the absolute highest in power is SUPREMACY." },
        { type: "cloze", word: "Lioness", sentence: "The fierce <span class='highlight-blank'></span> hunted the gazelle to bring food back to her cubs.", explanation: "The suffix -ess means female. The female lion is the LIONESS." },
        { type: "cloze", word: "Selfish", sentence: "It was incredibly <span class='highlight-blank'></span> of him to eat the entire pizza and leave absolutely none for his friends.", explanation: "Caring only about yourself makes you SELFISH." },
        { type: "cloze", word: "Amateurish", sentence: "The school play was charming, but the lighting and acting felt a bit <span class='highlight-blank'></span> compared to a real Broadway show.", explanation: "Because it lacked professional skill, it was AMATEURISH." },
        { type: "cloze", word: "Childish", sentence: "Refusing to share the video game and throwing a tantrum on the floor is very <span class='highlight-blank'></span> behavior for a teenager.", explanation: "Acting immaturely or 'like a child' is CHILDISH." },
        { type: "cloze", word: "Conspiracy", sentence: "The detectives uncovered a secret <span class='highlight-blank'></span> to rob the city bank on New Year's Eve.", explanation: "A secret, harmful plan made by a group is a CONSPIRACY." },
        { type: "cloze", word: "Bureaucracy", sentence: "Getting a simple building permit turned into a nightmare of paperwork and endless <span class='highlight-blank'></span>.", explanation: "A large, complex organization of appointed officials and rules is a BUREAUCRACY." },
        { type: "cloze", word: "Fallacy", sentence: "The idea that cracking your knuckles causes arthritis is a popular <span class='highlight-blank'></span> that doctors have proven false.", explanation: "A mistaken belief or false idea is a FALLACY." }
    ];

    // Combine BOTH arrays and shuffle them into a massive 40-question gauntlet
    let allQuestions = [...rawMCQ, ...rawCloze].sort(() => Math.random() - 0.5);

    let currentIdx = 0;
    let score = 0;

    // Build the Word Bank
    const bankContainer = document.getElementById("word-bank");
    const sortedWords = [...allWords].sort();
    sortedWords.forEach(w => {
        const span = document.createElement("span");
        span.className = "bank-word";
        span.id = "bank-" + w.toLowerCase();
        span.innerText = w;
        bankContainer.appendChild(span);
    });

    function updateProgress() {
        const percentage = (currentIdx / allQuestions.length) * 100;
        document.getElementById("progress-fill").style.width = percentage + "%";
    }

    function loadQuestion() {
        updateProgress();
        const q = allQuestions[currentIdx];
        const display = document.getElementById("text-display");
        const mcqArea = document.getElementById("mcq-options");
        const clozeArea = document.getElementById("cloze-input-area");
        const formatLabel = document.getElementById("format-label");
        const wordBank = document.getElementById("word-bank");

        if (q.type === 'mcq') {
            formatLabel.innerText = "MODE: MULTIPLE CHOICE";
            formatLabel.style.color = "#8b949e";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.text}`;
            
            // Hide word bank and cloze input, show MCQ buttons
            wordBank.style.display = "none";
            clozeArea.style.display = "none";
            mcqArea.style.display = "flex";
            
            mcqArea.innerHTML = "";
            const scrambledChoices = [...q.choices].sort(() => Math.random() - 0.5);
            scrambledChoices.forEach(c => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerHTML = c.text;
                btn.onclick = () => checkMCQAnswer(c.correct, q.explanation);
                mcqArea.appendChild(btn);
            });

        } else if (q.type === 'cloze') {
            formatLabel.innerText = "MODE: CLOZE DECRYPTION";
            formatLabel.style.color = "#ffb703";
            display.innerHTML = `<b>FILE ${currentIdx + 1}/${allQuestions.length}:</b><br><br>${q.sentence}`;
            
            // Hide MCQ buttons, show word bank and cloze input
            mcqArea.style.display = "none";
            wordBank.style.display = "flex";
            clozeArea.style.display = "flex";
            
            const input = document.getElementById("cloze-input");
            input.value = "";
            setTimeout(() => input.focus(), 100); 
        }
    }

    function checkMCQAnswer(isCorrect, explanation) {
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (isCorrect) {
            score++;
            status.innerText = "VERIFIED";
            status.style.color = "#3fb950"; 
        } else {
            status.innerText = "ERROR";
            status.style.color = "#f85149"; 
        }
        document.getElementById("fb-info").innerText = explanation;
        modal.style.display = "flex";
    }

    function checkClozeAnswer() {
        const inputVal = document.getElementById("cloze-input").value.trim().toLowerCase();
        const correctAns = allQuestions[currentIdx].word.toLowerCase();
        
        const modal = document.getElementById("feedback-modal");
        const status = document.getElementById("fb-status");

        if (inputVal === correctAns) {
            score++;
            status.innerText = "ACCESS GRANTED";
            status.style.color = "#3fb950"; 
            
            // Cross off the specific word in the bank so they know it has been used!
            const bankWord = document.getElementById("bank-" + correctAns);
            if(bankWord) bankWord.classList.add("used");
            
            document.getElementById("fb-info").innerText = "Correct! " + allQuestions[currentIdx].explanation;
        } else {
            status.innerText = "ACCESS DENIED";
            status.style.color = "#f85149"; 
            document.getElementById("fb-info").innerHTML = `Target sequence was: <b style="color:#ffb703;">${allQuestions[currentIdx].word}</b>.<br><br>${allQuestions[currentIdx].explanation}`;
        }
        
        modal.style.display = "flex";
    }

    function nextQuestion() {
        document.getElementById("feedback-modal").style.display = "none";
        currentIdx++;

        if (currentIdx < allQuestions.length) {
            loadQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("format-label").style.display = "none";
        document.getElementById("cloze-input-area").style.display = "none";
        document.getElementById("mcq-options").style.display = "none";
        document.getElementById("word-bank").style.display = "none";
        document.getElementById("quiz-content").innerHTML = `
            <div style="text-align:center; padding: 30px 0;">
                <h2 style="font-family:'Orbitron'; font-size: 2.5rem; color: #ffb703;">PROTOCOL COMPLETE</h2>
                <p style="font-size:3.5rem; margin:10px 0; font-family:'Share Tech Mono';">${Math.round((score/allQuestions.length)*100)}%</p>
                <p style="font-size: 1.2rem; color: #8b949e;">You scored ${score} out of ${allQuestions.length}.</p>
                <a href="index.html" class="next-btn" style="text-decoration:none; display:inline-block;">RETURN TO DASHBOARD</a>
            </div>`;
    }

    // Allow "Enter" key for submission, but ONLY on Cloze questions
    document.getElementById("cloze-input").addEventListener("keypress", function(event) {
        if (event.key === "Enter" && allQuestions[currentIdx].type === 'cloze') {
            event.preventDefault();
            checkClozeAnswer();
        }
    });

    loadQuestion();
</script>
</body>
</html>
